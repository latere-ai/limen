# The production target: the Limen core as Latere runs it, the decision
# service of the Agents capability's hosted sessions. It is declared in
# .lateregate.yaml under both identity.skip and identity.overlays, so the
# gate's no-latere-value rule reads the addresses set here rather than
# refusing them.
#
# Everything here is safe to re-apply, because the release pipeline applies
# it on every release with `kubectl apply -k deploy/prod` and then sets the
# image to the digest it built. A resource that cannot be re-applied belongs
# in deploy/bootstrap/, which the pipeline never reads.
#
# The Secrets limend-authorizer, platformd-internal-ca and ghcr-secret are
# created outside the tree and keep their names. The ConfigMap is generated
# here, so a change of a setting renames it and rolls the Pod that reads it.
#
# The Deployment names the image with the placeholder tag `unreleased`,
# which never resolves, so a target that pins nothing fails to pull rather
# than running an unknown build. The images entry below names the release
# this target runs. `lateregate release` rewrites the version in the same
# commit as the changelog section, under the release.stamp entry in
# .lateregate.yaml, so this line never lags a tag.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: latere
resources:
  - serviceaccount.yaml
  - pvc.yaml
  - deployment.yaml
  - service.yaml
  - pdb.yaml
  - networkpolicy.yaml
  - networkpolicy-platformd.yaml
  - ingress.yaml
images:
  - name: ghcr.io/latere-ai/limen
    newTag: v0.8.0
configMapGenerator:
  - name: limend
    envs:
      - limend.env
