# The account the core runs as. It holds no token of the cluster's API,
# since limend asks the cluster nothing. Its image is pulled with ghcr-secret,
# the docker-registry Secret every latere-ai image in this namespace pulls
# with, so the Pods pull whether the package is public or private.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: limend
  labels:
    app.kubernetes.io/name: limend
automountServiceAccountToken: false
imagePullSecrets:
  - name: ghcr-secret
