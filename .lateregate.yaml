# The shared quality bar, read by `go tool lateregate`. The gates live in
# latere.ai/x/ci-gate, pinned in go.mod; only decisions this repository
# makes are written here, each with its reason.

# The identity shape of the family. Limen is a core: limend verifies a
# caller's token and asks one authorizer, and decides nothing about a
# person (specs/001-architecture.md). An open core is reached where it is
# self-hosted, so no client registry carries a row for it.
identity:
  role: core
  audience: limen
  config_prefix: LIMEN
  api_group: limen.latere.ai
  reached_by: self-hosted
  roles_only: true

# Apache-2.0, like the research implementation the engine is ported from
# (github.com/changkun/trustcalib) and the harness-side cores it serves.
license:
  spdx: Apache-2.0
  holder: Latere AI
  extensions: ['.go']
  names: [Makefile, Dockerfile]

spec:
  # The lifecycle of specs/README.md. `superseded` is terminal beside
  # `complete` for a design a later spec replaces.
  status:
    - vague
    - drafted
    - validated
    - dispatched
    - in-progress
    - testing
    - complete
    - stale
    - superseded
  # Every spec says what it changes and what it waits for, so the index
  # can order the work queue.
  require: [title, status, track, depends_on, affects, effort, created, updated, author]
  wikilinks: true
  numbered: true
  started: [dispatched, in-progress, testing, complete]
  settled: [complete, superseded]
  require_section:
    - Overview
    - Design
    - Acceptance criteria
  require_section_by_status:
    complete: [Outcome]
  # The API spec and the principles are tables of routes, codes and
  # invariants; a row whose cell count drifts renders as a missing column.
  tables: true

# The contract's dependency invariant (specs/002-contract.md): the root
# package, which every harness imports, reaches the standard library and
# nothing else, and the authorizer vocabulary adds only the shared
# authorizer contract.
depcheck:
  packages:
    latere.ai/x/limen:
      decision: >-
        the contract is imported into every decision point's hot path, so
        it reaches the standard library and the shared decision vocabulary
        alone; an engine dependency lives in engine/, never here
      allow:
        latere.ai/x/pkg: latere.ai/x/pkg/verdict alone, the decision vocabulary every decision point shares, itself standard library only
    latere.ai/x/limen/authorizer:
      decision: >-
        the vocabulary is data for the shared authorizer contract and
        reaches that contract and the standard library
      allow:
        latere.ai/x/pkg: the shared authorizer contract, latere.ai/x/pkg/authz
        github.com/google/uuid: reached through latere.ai/x/pkg/authz and its httpjson, which parses UUID path parameters with it
    latere.ai/x/limen/engine/kernel:
      decision: >-
        the covariance functions are arithmetic over feature vectors and
        reach the standard library alone (specs/004-engine.md)
      allow: {}
    latere.ai/x/limen/engine/gp:
      decision: >-
        the Laplace posterior needs a dense Cholesky factorization and
        matrix-vector products at n of a few hundred; gonum is the library
        the research implementation it is ported from uses, it is pure Go,
        and its results reproduce the reference's fixtures to rounding
        (specs/004-engine.md)
      allow:
        gonum.org/v1/gonum: dense Cholesky factorization, symmetric matrices, and the BLAS and LAPACK routines under them
    latere.ai/x/limen/engine:
      decision: >-
        the service over the model: the featurizer, the posterior, the
        store interface and the estimators, so it reaches gonum through gp
        and the shared verdict vocabulary through the contract
        (specs/004-engine.md)
      allow:
        gonum.org/v1/gonum: through engine/gp, the dense linear algebra of the posterior
        latere.ai/x/pkg: latere.ai/x/pkg/verdict, through the contract
    latere.ai/x/limen/engine/store/file:
      decision: >-
        a store in a directory writes snapshots and profiles whole and
        atomically, which latere.ai/x/pkg/atomicfile already does with the
        directory fsync it needs (specs/004-engine.md)
      allow:
        latere.ai/x/pkg: atomicfile, and verdict through the contract
    latere.ai/x/limen/importer/topos:
      decision: >-
        reads Topos session logs through Topos's own session store, not a
        copy of its log format, and the declared effects of Topos's built-in
        tools, so the importer follows the format as Topos changes it
      allow:
        latere.ai/x/topos: session, session/dir, harness/tools and what they import (machine, models, prompts)
        latere.ai/x/pkg: verdict, and llmdialect through Topos's session package
    latere.ai/x/limen/cmd/limen:
      decision: >-
        the command line over the engine, its file store and the Topos
        importer, and nothing they do not already reach
      allow:
        latere.ai/x/topos: through importer/topos
        latere.ai/x/pkg: verdict, atomicfile, errwriter, and llmdialect through Topos's session package
        gonum.org/v1/gonum: the engine's linear algebra
    latere.ai/x/limen/cmd/limend:
      decision: >-
        the server over the engine and its file store, verifying tokens
        with the family's shared verifier, latere.ai/x/pkg/authkit/jwt,
        whose key-set reads go through pkg/otel's instrumented client, so
        the OpenTelemetry SDK and its OTLP exporters come with it as they
        do in every core; nothing else does without a row here
      allow:
        latere.ai/x/pkg: verdict, atomicfile, errwriter, and authz, authkit, bearer and httpjson through server
        gonum.org/v1/gonum: the engine's linear algebra
        github.com/google/uuid: reached through latere.ai/x/pkg/authz and httpjson, which parse UUID path parameters with it
        go.opentelemetry.io: the OpenTelemetry API, SDK and OTLP exporters pkg/otel builds on
        google.golang.org/protobuf: the wire encoding of the OTLP exporters
        google.golang.org/grpc: reached by the OTLP trace exporter's shared types
        google.golang.org/genproto: the status types grpc carries
        github.com/grpc-ecosystem/grpc-gateway: reached by the OTLP HTTP exporters' error mapping
        golang.org/x/net: HTTP/2 and trace support of grpc
        golang.org/x/sys: the platform calls of grpc and the SDK
        golang.org/x/text: text normalization of golang.org/x/net
        golang.org/x/time: the rate limiter of pkg/otel's log proxy
        github.com/cenkalti/backoff: the OTLP exporters' retry backoff
        github.com/cespare/xxhash: attribute hashing in the metric SDK
        github.com/felixge/httpsnoop: response capture in otelhttp
        github.com/go-logr: the SDK's internal logger
