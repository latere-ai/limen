name: Feature request
description: A function that Limen does not have.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: >
        Tell what you want to do and where Limen stops you. Describe the
        problem, not the solution. With the problem, we can find the best
        solution more easily.
    validations:
      required: true

  - type: textarea
    id: idea
    attributes:
      label: What you have in mind
      description: Optional. Tell how you would solve the problem, and which solutions you do not want.

  - type: textarea
    id: workaround
    attributes:
      label: What you do today
      description: Optional. Tell what you do now to get around the problem.
