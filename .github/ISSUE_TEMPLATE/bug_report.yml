name: Bug report
description: Limen does something that it must not do, or does not do something that it must do.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Do not report a security vulnerability here. Follow
        [SECURITY.md](https://github.com/latere-ai/limen/blob/main/SECURITY.md).

  - type: textarea
    id: what
    attributes:
      label: What happened
      description: Tell what you did, what you expected, and what occurred.
      placeholder: |
        I recorded a decision and sent the answer. Then the prediction for the same action was ...
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: How to reproduce
      description: >
        Give the shortest procedure that shows the problem. If possible,
        give the `curl` or `limen replay` command, its output, the action,
        and the cost profile. Remove all tokens. Remove each part of the
        input of an action that you do not want to publish.
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version
      description: The release tag or the image digest. Get it with `limend -version`.
      placeholder: v0.6.0
    validations:
      required: true

  - type: dropdown
    id: runtime
    attributes:
      label: How Limen runs
      options:
        - limend, over HTTP
        - The engine, in process
        - Through a harness such as Topos
        - Not applicable
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: >
        The related lines from the output of limend. Remove all tokens.
        Remove each host name that you do not want to publish.
      render: text
