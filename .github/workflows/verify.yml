# Every push to main and every pull request runs the gate, the shared
# pipeline of latere-ai/ci, and the checks that need the tree and no
# cluster: a tidy module file, workflows actionlint accepts, and an image
# that builds and reports its version. Every third-party action is pinned
# by commit.
name: verify
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read

# A newer push to the same ref supersedes this run: its commit carries every
# change this one would verify, and the runner is better spent on it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  # The repository is private, so the jobs that need Go alone run on the
  # organization's self-hosted runner; the image job needs Docker and runs
  # on a hosted runner.
  gate:
    if: "!startsWith(github.ref, 'refs/tags/')"
    uses: latere-ai/ci/.github/workflows/lateregate.yml@v1
    with:
      runs_on: linux-vm
      test_os: '["linux-vm"]'

  tidy:
    name: go.mod and go.sum are tidy
    if: "!startsWith(github.ref, 'refs/tags/')"
    runs-on: linux-vm
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          # The runner keeps its module cache between runs.
          cache: false
      # The depcheck rows name the module's dependencies; go.mod is where a
      # reader checks the claim, so it has to agree with the imports.
      - run: go mod tidy -diff

  actionlint:
    name: the workflows pass actionlint
    if: "!startsWith(github.ref, 'refs/tags/')"
    runs-on: linux-vm
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # A wrong input name on a reusable workflow is otherwise found only on
      # a tag.
      - run: |
          set -euo pipefail
          bash <(curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/v1.7.12/scripts/download-actionlint.bash) 1.7.12
          ./actionlint -color

  image:
    name: the developer image builds
    if: "!startsWith(github.ref, 'refs/tags/')"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: docker build -t limend:candidate .
      - name: The image reports its version
        run: |
          docker run --rm limend:candidate -version | grep -q '^limend '
