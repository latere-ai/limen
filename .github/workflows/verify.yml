# Every push to main and every pull request runs the gate, the shared
# pipeline of latere-ai/ci, and the checks that need the tree and no
# cluster. Every third-party action is pinned by commit.
name: verify

# A push or pull request that changes only specs or markdown outside the
# exception starts no run, because no build or test reads them. The exception
# is the markdown inside a testdata directory, which tests load as fixtures.
# `lateregate release` runs the whole bar, the spec tree included, before every
# tag. A tag is never filtered by paths.
on:
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - "**"
      - "!specs/**"
      - "!**.md"
      - "**/testdata/**"
  pull_request:
    paths:
      - "**"
      - "!specs/**"
      - "!**.md"
      - "**/testdata/**"
  workflow_dispatch:
permissions:
  contents: read

# A newer push to the same ref supersedes this run: its commit carries every
# change this one would verify, and the runner is better spent on it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  # Every job runs where the organization's runner policy says (latere-ai/ci,
  # README, Runners): a public repository on GitHub's hosted runner,
  # ubuntu-latest, and a private one on the self-hosted runner, each falling
  # back to the other while its own is unavailable.
  gate:
    if: "!startsWith(github.ref, 'refs/tags/')"
    uses: latere-ai/ci/.github/workflows/lateregate.yml@v1
