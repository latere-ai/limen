# The release pipeline, on a v* tag, through latere-ai/ci's shared image
# release stages. The build stage requires that the tag's commit passed
# verify, checks the tag and its CHANGELOG section, compiles limend once
# from the tag for each architecture, builds the image `limen` from those
# binaries for linux/amd64 and linux/arm64, pushes it by digest and under no
# tag, checks the candidate reports the version the tag pins, signs it, and
# gives it a bill of materials. The deploy stage then rolls Latere's own
# installation, only where the repository variable LIMEN_RELEASE_DEPLOY is
# set: deploy/prod applied with limend pinned by digest, the Deployment
# waited for, and tools/smoke/release.sh repeated against the live origin.
# Only then does the publish stage tag the digest, sign checksums.txt over
# the binaries and the bill of materials, and publish the GitHub release
# with the CHANGELOG section as its body, those files attached and the smoke
# evidence appended. The verify stage then checks the published release
# from a runner with no checkout.
#
# The image namespace is the repository owner's, so a fork's tag publishes
# under the fork's. Each job is granted only what its stage needs, and runs
# where the organization's runner policy says (latere-ai/ci, README,
# Runners): a public repository on GitHub's hosted runner, ubuntu-latest,
# and a private one on the self-hosted runner, each falling back to the
# other while its own is unavailable.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    uses: latere-ai/ci/.github/workflows/image-build.yml@v1
    permissions:
      contents: read
      actions: read
      packages: write
      id-token: write
      attestations: write
    with:
      # Dockerfile.ci copies the binary the archives command compiled for
      # each platform. The binary, limend, names itself in its version line,
      # not the image.
      image_1: '{"name": "limen", "dockerfile": "Dockerfile.ci", "version_args": "-version", "version_expect": "limend {tag} ("}'
      # limend for each architecture of the image index, with the build
      # identity -version reports, written into dist/, which the release
      # attaches.
      archives_command: |
        pkg=$(go list -m)/internal/version
        ldflags="-X ${pkg}.Version=${TAG} -X ${pkg}.Commit=$(git rev-parse --short HEAD) -X ${pkg}.Date=$(TZ=UTC git log -1 --format=%cd --date=format-local:%Y-%m-%dT%H:%M:%SZ)"
        for arch in amd64 arm64; do
          CGO_ENABLED=0 GOOS=linux GOARCH="$arch" go build -trimpath -ldflags "$ldflags" -o "dist/limend_linux_${arch}" ./cmd/limend
        done

  # The shared deploy stage, under the production environment, so the
  # rollout is a GitHub deployment with a URL on the repository's
  # Deployments page. The repository variable and the kubeconfig secret are
  # set on this repository and on no fork, so a tag on a fork publishes
  # every artifact and skips this job. The image is given by digest, as the
  # overlay's own name for it, because it carries no tag until publish.
  # deploy/prod holds only re-appliable manifests; deploy/bootstrap is never
  # read.
  deploy:
    name: deploy and smoke
    # build is named for its outputs: a job reads the outputs of the jobs it
    # needs directly, and of no other.
    needs: build
    if: ${{ vars.LIMEN_RELEASE_DEPLOY != '' }}
    uses: latere-ai/ci/.github/workflows/image-deploy.yml@v1
    permissions:
      contents: read
    with:
      images: ghcr.io/latere-ai/limen=${{ needs.build.outputs.ref_1 }}@${{ needs.build.outputs.digest_1 }}
      deployments: |
        limend
      url: https://api.latere.ai/v1/oversight
    secrets:
      DEPLOY_KUBECONFIG: ${{ secrets.LIMEN_KUBECONFIG }}

  publish:
    needs: [build, deploy]
    # deploy is skipped on every repository that sets no LIMEN_RELEASE_DEPLOY,
    # and a job that leans on the implicit success() is skipped whenever a
    # job above it in the graph is, so each result is named here.
    if: ${{ always() && needs.build.result == 'success' && needs.deploy.result != 'failure' && needs.deploy.result != 'cancelled' }}
    uses: latere-ai/ci/.github/workflows/image-publish.yml@v1
    permissions:
      contents: write
      packages: write
      id-token: write
    with:
      images: ${{ needs.build.outputs.images }}
      # The smoke evidence is the run artifact the deploy stage uploads. A
      # release whose deploy was skipped has none, and the publish stage
      # refuses an evidence pattern that names no file, so it is named only
      # when the deploy ran.
      evidence: ${{ needs.deploy.result == 'success' && 'smoke-evidence' || '' }}

  verify:
    needs: publish
    # deploy sits above this job in the graph and is skipped on a fork, so
    # the result this job waits on is named, as on publish.
    if: ${{ always() && needs.publish.result == 'success' }}
    uses: latere-ai/ci/.github/workflows/release-verify.yml@v1
    permissions:
      contents: read
      packages: read
      attestations: read
    with:
      images: limen
