# The release pipeline, on a v* tag: the tag's commit must have passed
# verify; limend is compiled once from the tag for each architecture, and
# the image `limen` is built from those binaries, pushed by digest and
# under no tag, signed, and given a bill of materials and a provenance
# attestation; the candidate must report the version the tag pins; only
# then is the digest tagged, and the GitHub release is created with the
# CHANGELOG section as its body by the family's shared notes pipeline.
#
# Nothing here pushes to the default branch, no job carries a permission
# another needs, and the image namespace is the repository owner's, so a
# fork's tag publishes under the fork's. Every third-party action is pinned
# by commit with its version in a comment.
#
# Every job runs where the organization's runner policy says (latere-ai/ci,
# README, Runners): for this private repository the self-hosted runner, or a
# hosted one while it is offline. The self-hosted runner carries Docker, git,
# jq and curl and nothing else: the job that calls the GitHub CLI fetches a
# pinned release of it first, and setup-go restores no cache over the module
# cache the runner keeps.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE: limen
  # The GitHub CLI release the job that calls it fetches, verified against
  # the release's checksums file.
  GH_VERSION: "2.103.3"

jobs:
  # 1. The tag's commit passed verify. `lateregate release` pushes the
  # branch and the tag in one push, so the verify run for that commit has
  # just started. This job reads the runs once and holds the runner for
  # seconds: a job that polled here would hold one of the self-hosted
  # runner's two slots while the run it waits for queues for the other, and
  # two releases at once would hold both. The commit `lateregate release`
  # cuts moves the notes under Unreleased into the tag's section and
  # changes nothing else, after the whole bar ran on the tree, so while its
  # own run has not concluded, a green run on its parent stands for it. A
  # tag on any other commit whose gate has not run green fails here and
  # publishes nothing. The run the tag's own push starts is not the one read.
  gate-green:
    name: the tag's commit passed verify
    runs-on: ${{ (github.event.repository.private || contains(fromJSON('["push","schedule","workflow_dispatch","release"]'), github.event_name)) && (vars.CI_RUNNER_PRIVATE || vars.CI_RUNNER_PUBLIC) || 'ubuntu-latest' }}
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    steps:
      # The self-hosted runner ships no GitHub CLI; the pinned release is
      # fetched and verified against its checksums file.
      - name: Ensure gh
        run: |
          set -euo pipefail
          if command -v gh >/dev/null 2>&1; then
            gh --version | head -n1
            exit 0
          fi
          dir="$RUNNER_TEMP/gh-bin"
          mkdir -p "$dir"
          base="https://github.com/cli/cli/releases/download/v${GH_VERSION}"
          archive="gh_${GH_VERSION}_linux_amd64.tar.gz"
          curl -sSfL -o "$dir/$archive" "$base/$archive"
          curl -sSfL -o "$dir/checksums.txt" "$base/gh_${GH_VERSION}_checksums.txt"
          (cd "$dir" && grep " $archive\$" checksums.txt | sha256sum -c)
          tar -xzf "$dir/$archive" -C "$dir" --strip-components=2 "gh_${GH_VERSION}_linux_amd64/bin/gh"
          echo "$dir" >> "$GITHUB_PATH"
          "$dir/gh" --version | head -n1
      - name: The verify run on this commit, or on its parent, concluded success
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # A failed API read fails the job rather than reading as pending.
          shopt -s inherit_errexit
          # success, failure, or pending (running, queued, superseded by a
          # newer push, or not started) for the verify run of a commit's
          # branch push.
          verdict() {
            local runs
            # $ENV is jq's, which reads the tag from the environment.
            # shellcheck disable=SC2016
            runs=$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/verify.yml/runs?head_sha=$1&event=push&per_page=20" \
              --jq '[.workflow_runs[] | select(.head_branch != $ENV.GITHUB_REF_NAME) | .conclusion // "running"] | join(" ")')
            case " $runs " in
              *" success "*) echo success ;;
              *" failure "*|*" timed_out "*|*" startup_failure "*|*" action_required "*) echo failure ;;
              *) echo pending ;;
            esac
          }
          own=$(verdict "$GITHUB_SHA")
          case "$own" in
            success) echo "verify concluded success on ${GITHUB_SHA}"; exit 0 ;;
            failure) echo "verify failed on ${GITHUB_SHA}; a release is cut from a green tree" >&2; exit 1 ;;
          esac
          parent=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}" --jq '.parents[0].sha')
          changed=$(gh api "repos/${GITHUB_REPOSITORY}/compare/${parent}...${GITHUB_SHA}" --jq '[.files[].filename] | join(" ")')
          if [ "$changed" = "CHANGELOG.md" ] && [ "$(verdict "$parent")" = success ]; then
            echo "verify has not concluded on ${GITHUB_SHA}, which changes CHANGELOG.md alone; it concluded success on its parent ${parent}"
            exit 0
          fi
          echo "verify has not concluded on ${GITHUB_SHA} (it changes: ${changed:-nothing}), and this job does not wait for it on the shared runner. Re-run the release once verify is green: gh run rerun ${GITHUB_RUN_ID} --failed --repo ${GITHUB_REPOSITORY}" >&2
          exit 1

  # 2. The binaries, compiled once from this checkout with the tag's build
  # identity, and the image built from them. The image is pushed by digest
  # and under no tag, so a run that stops before the digest is tagged
  # leaves one unreferenced digest and nothing an operator could pull by
  # accident.
  build:
    name: the binaries and the image by digest
    needs: gate-green
    runs-on: ${{ (github.event.repository.private || contains(fromJSON('["push","schedule","workflow_dispatch","release"]'), github.event_name)) && (vars.CI_RUNNER_PRIVATE || vars.CI_RUNNER_PUBLIC) || 'ubuntu-latest' }}
    timeout-minutes: 40
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    outputs:
      owner: ${{ steps.owner.outputs.owner }}
      digest: ${{ steps.image.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          # The self-hosted runner keeps its module cache between runs;
          # restoring a tarball over it fails on every file that exists.
          cache: false
      # The namespace is the account that pushed the tag, lowered, read
      # here and written nowhere in the tree. A repository variable
      # overrides it, for an installation that publishes elsewhere.
      - name: The image namespace is the repository owner's
        id: owner
        env:
          OVERRIDE: ${{ vars.RELEASE_IMAGE_NAMESPACE }}
        run: |
          owner=${OVERRIDE:-$GITHUB_REPOSITORY_OWNER}
          echo "owner=$(printf '%s' "$owner" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"
      - name: The tag has a CHANGELOG section
        run: go tool lateregate release-notes "${GITHUB_REF_NAME}" > /dev/null
      # An image tag cannot carry SemVer build metadata.
      - name: The tag is a valid image tag
        run: |
          case "${GITHUB_REF_NAME}" in
            *+*) echo "${GITHUB_REF_NAME} carries build metadata, which an image tag cannot; cut a tag without it" >&2; exit 1 ;;
          esac
      # limend for each architecture of the image index, with the build
      # identity the version flag reports.
      - name: Build the binaries
        run: |
          pkg=$(go list -m)/internal/version
          ldflags="-X ${pkg}.Version=${GITHUB_REF_NAME} -X ${pkg}.Commit=$(git rev-parse --short HEAD) -X ${pkg}.Date=$(git log -1 --format=%cd --date=format-local:%Y-%m-%dT%H:%M:%SZ)"
          mkdir -p dist
          for arch in amd64 arm64; do
            CGO_ENABLED=0 GOOS=linux GOARCH=$arch go build -trimpath -ldflags "$ldflags" -o "dist/limend_linux_${arch}" ./cmd/limend
          done
          (cd dist && sha256sum limend_linux_* | tee checksums.txt)
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build and push the image by digest, under no tag
        id: image
        env:
          OWNER: ${{ steps.owner.outputs.owner }}
        run: |
          mkdir -p out
          docker buildx build --platform linux/amd64,linux/arm64 -f Dockerfile.ci \
            --output "type=image,name=${REGISTRY}/${OWNER}/${IMAGE},push-by-digest=true,name-canonical=true,push=true" \
            --metadata-file out/image.json .
          digest=$(jq -r '."containerimage.digest"' out/image.json)
          echo "the candidate is ${REGISTRY}/${OWNER}/${IMAGE}@${digest}"
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"
      # The candidate reports the build identity this tag pins, so the
      # binary inside is the one compiled above.
      - name: The image reports the version this tag pins
        env:
          OWNER: ${{ steps.owner.outputs.owner }}
        run: |
          got=$(docker run --rm "${REGISTRY}/${OWNER}/${IMAGE}@${{ steps.image.outputs.digest }}" -version)
          echo "$got"
          case "$got" in
            "limend ${GITHUB_REF_NAME} ("*) ;;
            *) echo "the image reports '$got' and the tag is ${GITHUB_REF_NAME}" >&2; exit 1 ;;
          esac
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Sign the image by digest with the workflow's identity
        env:
          OWNER: ${{ steps.owner.outputs.owner }}
        run: cosign sign --yes "${REGISTRY}/${OWNER}/${IMAGE}@${{ steps.image.outputs.digest }}"
      - name: The bill of materials of the image
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ${{ env.REGISTRY }}/${{ steps.owner.outputs.owner }}/${{ env.IMAGE }}@${{ steps.image.outputs.digest }}
          format: spdx-json
          output-file: dist/sbom-limen.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - name: Attest the image's bill of materials
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-name: ${{ env.REGISTRY }}/${{ steps.owner.outputs.owner }}/${{ env.IMAGE }}
          subject-digest: ${{ steps.image.outputs.digest }}
          sbom-path: dist/sbom-limen.spdx.json
          push-to-registry: true
      - name: Attest the image's provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.REGISTRY }}/${{ steps.owner.outputs.owner }}/${{ env.IMAGE }}
          subject-digest: ${{ steps.image.outputs.digest }}
          push-to-registry: true

  # 3. Only now does the digest get the :<tag> reference.
  publish:
    name: tag the digest
    needs: build
    runs-on: ${{ (github.event.repository.private || contains(fromJSON('["push","schedule","workflow_dispatch","release"]'), github.event_name)) && (vars.CI_RUNNER_PRIVATE || vars.CI_RUNNER_PUBLIC) || 'ubuntu-latest' }}
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    env:
      OWNER: ${{ needs.build.outputs.owner }}
    steps:
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Tag the digest
        run: |
          docker buildx imagetools create -t "${REGISTRY}/${OWNER}/${IMAGE}:${GITHUB_REF_NAME}" \
            "${REGISTRY}/${OWNER}/${IMAGE}@${{ needs.build.outputs.digest }}"
          echo "published ${REGISTRY}/${OWNER}/${IMAGE}:${GITHUB_REF_NAME} at ${{ needs.build.outputs.digest }}"

  # 4. The GitHub release, with the CHANGELOG section for the tag as its
  # body, created by the family's shared notes pipeline once the image it
  # announces is tagged.
  release:
    needs: publish
    permissions:
      contents: write
    uses: latere-ai/ci/.github/workflows/notes-release.yml@v1
    secrets: inherit
