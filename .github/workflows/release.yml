# The release pipeline, on a v* tag, through latere-ai/ci's shared image
# release stages. The build stage requires that the tag's commit passed
# verify, checks the tag and its CHANGELOG section, compiles limend once
# from the tag for each architecture, builds the image `limen` from those
# binaries for linux/amd64 and linux/arm64, pushes it by digest and under no
# tag, checks the candidate reports the version the tag pins, signs it, and
# gives it a bill of materials. Only then does the publish stage tag the
# digest, sign checksums.txt over the binaries and the bill of materials,
# and publish the GitHub release with the CHANGELOG section as its body and
# those files attached. The verify stage then checks the published release
# from a runner with no checkout.
#
# The image namespace is the repository owner's, so a fork's tag publishes
# under the fork's. Each job is granted only what its stage needs, and runs
# where the organization's runner policy says (latere-ai/ci, README,
# Runners): for this private repository the self-hosted runner, or a hosted
# one while it is offline.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    uses: latere-ai/ci/.github/workflows/image-build.yml@c3fcc1bda62305ca978a5474dd29a898564baa42
    permissions:
      contents: read
      actions: read
      packages: write
      id-token: write
      attestations: write
    with:
      # Dockerfile.ci copies the binary the archives command compiled for
      # each platform. The binary, limend, names itself in its version line,
      # not the image.
      image_1: '{"name": "limen", "dockerfile": "Dockerfile.ci", "version_args": "-version", "version_expect": "limend {tag} ("}'
      # limend for each architecture of the image index, with the build
      # identity -version reports, written into dist/, which the release
      # attaches.
      archives_command: |
        pkg=$(go list -m)/internal/version
        ldflags="-X ${pkg}.Version=${TAG} -X ${pkg}.Commit=$(git rev-parse --short HEAD) -X ${pkg}.Date=$(TZ=UTC git log -1 --format=%cd --date=format-local:%Y-%m-%dT%H:%M:%SZ)"
        for arch in amd64 arm64; do
          CGO_ENABLED=0 GOOS=linux GOARCH="$arch" go build -trimpath -ldflags "$ldflags" -o "dist/limend_linux_${arch}" ./cmd/limend
        done
      # A verify run still going refuses the release at once: a job that
      # waited would hold one of the self-hosted runner's two slots while
      # the run it waits for queues for the other, and two releases at once
      # would hold both. The stage prints the command that re-runs the
      # release once verify is green.
      wait_minutes: "0"

  publish:
    needs: build
    uses: latere-ai/ci/.github/workflows/image-publish.yml@c3fcc1bda62305ca978a5474dd29a898564baa42
    permissions:
      contents: write
      packages: write
      id-token: write
    with:
      images: ${{ needs.build.outputs.images }}

  verify:
    needs: publish
    uses: latere-ai/ci/.github/workflows/release-verify.yml@c3fcc1bda62305ca978a5474dd29a898564baa42
    permissions:
      contents: read
      packages: read
      attestations: read
    with:
      images: limen
