openapi: 3.1.0
info:
  title: Limen
  version: "1"
  summary: The oversight layer for automated actions.
  description: >-
    Limen serves the decision point that lets an automated action run or
    not: an agent's tool call, a network request, a push, a payment. It
    predicts, for the person on whose behalf the action runs, the
    probability that they would approve it and suggests a verdict from the
    costs their organization states; it keeps a ledger of what each decision
    point decided, with the probability that a person saw the action, and
    of the person's answers; and it reports how often any source of
    decisions allows what the person would deny. The decision point decides
    and draws reviews itself; Limen never applies a verdict. Every record is
    keyed by the organization, the subject, and the decision point's own id
    for the action. The server serves these routes under /v1; a platform may
    mount them under a prefix of its own. Every route asks the
    installation's authorizer for the action named in x-limen-action, about
    a resource of the kind and with the fields named in x-limen-resource,
    before it acts. Request and response bodies are JSON (the replay upload
    is newline-delimited JSON); a receiver ignores fields it does not know,
    so a newer client can talk to an older server, and validates the fields
    it knows strictly. Where several error codes share a status on one
    route, the response lists them in x-limen-codes.
  license:
    name: Apache-2.0
    identifier: Apache-2.0
security:
- bearer: []
paths:
  /v1/predictions:
    post:
      operationId: predict
      summary: Predict an action
      description: >-
        Limen's prediction for one proposed action: the probability that the
        subject approves it, how uncertain that is, and the verdict it
        suggests under the cost profile that applies. Idempotent on the
        action's key: a repeat with the same action returns the first
        prediction, and a repeat with a different action is refused with
        action_conflict. Limen reads the action's input to extract features
        and never stores it.
      x-limen-action: case.predict
      x-limen-resource:
        kind: Case
        fields: [org, subject]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Action"
      responses:
        "200":
          description: The prediction, new or the one already made for this action.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Prediction"
        "400":
          $ref: "#/components/responses/invalid_action"
        "401":
          $ref: "#/components/responses/unauthenticated"
        "403":
          $ref: "#/components/responses/forbidden"
        "409":
          $ref: "#/components/responses/action_conflict"
        "413":
          $ref: "#/components/responses/body_too_large"
        "429":
          $ref: "#/components/responses/rate_limited"
        "500":
          $ref: "#/components/responses/internal"
        "503":
          $ref: "#/components/responses/service_unavailable"
  /v1/decisions:
    post:
      operationId: recordDecision
      summary: Record a decision
      description: >-
        Record what the decision point did with one action: the verdict it
        applied, the probability, fixed before the action ran, that a person
        sees it, and the policy that decided. Record every decision, not
        only the ones a person sees: a source's allows are the denominator
        of its error rate. An action takes one decision. When Limen holds no
        prediction for the action, as after a fail-closed fallback, the
        decision carries the action.
      x-limen-action: case.decide
      x-limen-resource:
        kind: Case
        fields: [org, subject]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Decision"
      responses:
        "204":
          description: The decision is recorded.
        "400":
          $ref: "#/components/responses/invalid_decision"
        "401":
          $ref: "#/components/responses/unauthenticated"
        "403":
          $ref: "#/components/responses/forbidden"
        "409":
          description: "409 already_decided or action_conflict: the action already has a decision, or the action the decision carries differs from the one predicted."
          x-limen-codes: [already_decided, action_conflict]
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "413":
          $ref: "#/components/responses/body_too_large"
        "429":
          $ref: "#/components/responses/rate_limited"
        "500":
          $ref: "#/components/responses/internal"
        "503":
          $ref: "#/components/responses/service_unavailable"
  /v1/answers:
    post:
      operationId: answer
      summary: Send an answer
      description: >-
        Record a person's answer about an action whose decision is recorded.
        Limen stamps the time. The first answer to an action the decision
        showed a person is its review and enters error estimates; any later
        answer, or an answer to an action nobody was shown, trains the model
        only. A caller that relays an answer for someone else names them in
        by, which is honored only when the authorizer allows the caller to
        answer for the subject. The decision point relays how the person
        answered (answer_ms, waited_ms, details_opened, suggestion_shown,
        surface, remembered) and leaves out each field it does not know.
        They set the weight of the answer for the cover rule (weights/1): an
        approval counts 0 if a standing rule gave it, if one gesture answered
        many actions, if it came faster than 2000 ms, if it followed a lean
        the client showed, or if 50 reviews came before it in its session,
        each but the first unless the details were opened. The estimates
        never read the weight.
      x-limen-action: case.answer
      x-limen-resource:
        kind: Case
        fields: [org, subject]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Answer"
      responses:
        "413":
          $ref: "#/components/responses/body_too_large"
        "204":
          description: The answer is recorded.
        "400":
          $ref: "#/components/responses/invalid_answer"
        "401":
          $ref: "#/components/responses/unauthenticated"
        "403":
          $ref: "#/components/responses/forbidden"
        "409":
          $ref: "#/components/responses/no_decision"
        "429":
          $ref: "#/components/responses/rate_limited"
        "500":
          $ref: "#/components/responses/internal"
        "503":
          $ref: "#/components/responses/service_unavailable"
  /v1/cases:
    get:
      operationId: listCases
      summary: List a person's cases
      description: >-
        One subject's cases in one organization, oldest first: each action
        without its input, its prediction, its decision, and its answers.
        With action_id, the one case of that action. With pending=true, the
        review queue: actions a decision showed a person that have no review
        yet.
      x-limen-action: case.list
      x-limen-resource:
        kind: Case
        fields: [org, subject]
      parameters:
      - $ref: "#/components/parameters/org"
      - $ref: "#/components/parameters/subject"
      - name: action_id
        in: query
        schema:
          type: string
      - name: pending
        in: query
        schema:
          type: boolean
          default: false
      - name: cursor
        in: query
        description: The next_cursor of the previous page.
        schema:
          type: string
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 500
          default: 100
      responses:
        "200":
          description: One page of cases.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Page"
        "400":
          $ref: "#/components/responses/invalid_query"
        "401":
          $ref: "#/components/responses/unauthenticated"
        "403":
          $ref: "#/components/responses/forbidden"
        "429":
          $ref: "#/components/responses/rate_limited"
        "500":
          $ref: "#/components/responses/internal"
        "503":
          $ref: "#/components/responses/service_unavailable"
  /v1/reliability:
    get:
      operationId: getReliability
      summary: Report a source's error rates
      description: >-
        How often one source's verdicts disagreed with one person over one
        window: Limen's suggestions (of=learned), the verdicts decision
        points applied (of=applied), one decision source such as rules/1, or
        one signal source such as classifier/claude-auto-mode. Each review
        counts with weight one over its decision's review probability. A
        rate is null, not zero, when no action in the window could have been
        reviewed.
      x-limen-action: reliability.read
      x-limen-resource:
        kind: Reliability
        fields: [org, subject]
      parameters:
      - $ref: "#/components/parameters/org"
      - $ref: "#/components/parameters/subject"
      - name: of
        in: query
        required: true
        schema:
          type: string
          examples:
          - learned
          - applied
          - rules/1
          - classifier/claude-auto-mode
      - name: from
        in: query
        required: true
        schema:
          type: string
          format: date-time
      - name: to
        in: query
        required: true
        schema:
          type: string
          format: date-time
      responses:
        "200":
          description: The report.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Reliability"
        "400":
          $ref: "#/components/responses/invalid_query"
        "401":
          $ref: "#/components/responses/unauthenticated"
        "403":
          $ref: "#/components/responses/forbidden"
        "429":
          $ref: "#/components/responses/rate_limited"
        "500":
          $ref: "#/components/responses/internal"
        "503":
          $ref: "#/components/responses/service_unavailable"
  /v1/profiles:
    get:
      operationId: getProfile
      summary: Read the profile that applies
      description: >-
        The cost profile that applies to a scope: the most specific saved
        profile, in the order kind and agent, agent, kind, organization, or
        the built-in default, which says so in default. With subject, the
        person's own profile as the person saved it, with subject in its
        scope; when the person saved none, the organization's profile for
        the scope of the org alone, with no subject. A prediction applies
        the meet of the two, which this route does not return.
      x-limen-action: profile.read
      x-limen-resource:
        kind: Profile
        fields: [org, action_kind, agent, subject]
      parameters:
      - $ref: "#/components/parameters/org"
      - $ref: "#/components/parameters/kind"
      - $ref: "#/components/parameters/agent"
      - $ref: "#/components/parameters/profileSubject"
      responses:
        "200":
          description: The profile with its derived thresholds.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Profile"
        "400":
          $ref: "#/components/responses/invalid_query"
        "401":
          $ref: "#/components/responses/unauthenticated"
        "403":
          $ref: "#/components/responses/forbidden"
        "429":
          $ref: "#/components/responses/rate_limited"
        "500":
          $ref: "#/components/responses/internal"
        "503":
          $ref: "#/components/responses/service_unavailable"
    put:
      operationId: putProfile
      summary: Save a profile
      description: >-
        Validate and save a profile for its scope. The thresholds are derived
        from the costs, and a profile that states no certify claim takes the
        default; values sent for thresholds or default are ignored. A
        profile with subject is that person's own profile in the
        organization: it has no kind and no agent, and it only ever makes
        the organization's profile stricter for that person.
      x-limen-action: profile.write
      x-limen-resource:
        kind: Profile
        fields: [org, action_kind, agent, subject]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Profile"
      responses:
        "413":
          $ref: "#/components/responses/body_too_large"
        "200":
          description: The saved profile with its derived thresholds.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Profile"
        "400":
          $ref: "#/components/responses/invalid_profile"
        "401":
          $ref: "#/components/responses/unauthenticated"
        "403":
          $ref: "#/components/responses/forbidden"
        "422":
          $ref: "#/components/responses/ask_too_costly"
        "429":
          $ref: "#/components/responses/rate_limited"
        "500":
          $ref: "#/components/responses/internal"
        "503":
          $ref: "#/components/responses/service_unavailable"
    delete:
      operationId: deleteProfile
      summary: Remove a saved profile
      description: >-
        Remove the profile saved for exactly the scope the query names. The
        next prediction takes the next scope in the order, and the default
        after the organization's: an agent's scope goes back to the
        organization's profile. A recorded prediction keeps its thresholds.
        Idempotent: a scope with no saved profile is also 204. Asks
        profile.write, as a save of the same scope does.
      x-limen-action: profile.write
      x-limen-resource:
        kind: Profile
        fields: [org, action_kind, agent, subject]
      parameters:
      - $ref: "#/components/parameters/org"
      - $ref: "#/components/parameters/kind"
      - $ref: "#/components/parameters/agent"
      - $ref: "#/components/parameters/profileSubject"
      responses:
        "204":
          description: No profile is saved for the scope.
        "400":
          $ref: "#/components/responses/invalid_query"
        "401":
          $ref: "#/components/responses/unauthenticated"
        "403":
          $ref: "#/components/responses/forbidden"
        "429":
          $ref: "#/components/responses/rate_limited"
        "500":
          $ref: "#/components/responses/internal"
        "503":
          $ref: "#/components/responses/service_unavailable"
  /v1/reports:
    get:
      operationId: getReport
      summary: Report an organization by week
      description: >-
        The actions of an organization's agents and what the reviews of all
        its persons said, by week, never one person. from and to are each a
        Monday at 00:00 UTC, to is after from by at most 13 weeks, and the
        report has one entry per week. A week is open until 7 days after
        its end; a review counts in it only when it arrived before. A closed
        week with fewer than 5 persons is too_few and shows nothing more. A
        ready week shows its numbers, divided by agent, under the group rule
        and the answer rule; a field the answer rule removes is absent and
        listed in withheld. The first read of a closed week keeps it, and
        every later read returns it unchanged, also after a Forget.
      x-limen-action: report.read
      x-limen-resource:
        kind: Report
        fields: [org]
      parameters:
      - $ref: "#/components/parameters/org"
      - name: from
        in: query
        required: true
        schema:
          type: string
          format: date-time
          examples:
          - "2026-10-05T00:00:00Z"
      - name: to
        in: query
        required: true
        schema:
          type: string
          format: date-time
      responses:
        "200":
          description: The report.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Report"
        "400":
          $ref: "#/components/responses/invalid_query"
        "401":
          $ref: "#/components/responses/unauthenticated"
        "403":
          $ref: "#/components/responses/forbidden"
        "429":
          $ref: "#/components/responses/rate_limited"
        "500":
          $ref: "#/components/responses/internal"
        "503":
          $ref: "#/components/responses/service_unavailable"
  /v1/replays:
    post:
      operationId: replay
      summary: Replay recorded history
      description: >-
        Predict recorded actions in time order, each before its own answer
        is learned, and report what Limen would have suggested. Without
        keep, the replay learns in a scratch model and keeps nothing; with
        keep=true, the records are learned into the live models and the
        ledger, as if they had arrived as decisions and answers. At most
        100000 records per replay.
      x-limen-action: replay.create
      x-limen-resource:
        kind: Replay
        fields: [org]
      parameters:
      - name: keep
        in: query
        schema:
          type: boolean
          default: false
      requestBody:
        required: true
        content:
          application/x-ndjson:
            schema:
              $ref: "#/components/schemas/ReplayRecord"
      responses:
        "200":
          description: The report.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReplayReport"
        "400":
          $ref: "#/components/responses/invalid_replay"
        "401":
          $ref: "#/components/responses/unauthenticated"
        "403":
          $ref: "#/components/responses/forbidden"
        "413":
          $ref: "#/components/responses/body_too_large"
        "429":
          $ref: "#/components/responses/rate_limited"
        "500":
          $ref: "#/components/responses/internal"
        "503":
          $ref: "#/components/responses/service_unavailable"
  /v1/subjects/forget:
    post:
      operationId: forgetSubject
      summary: Forget a person
      description: >-
        Delete everything Limen holds about one subject in one organization:
        cases, answers, the model learned from them, and the person's own
        profile there. The kept weeks of the organization's reports stay,
        since they hold no record of a person. Idempotent.
      x-limen-action: subject.forget
      x-limen-resource:
        kind: Subject
        fields: [org, subject]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ForgetRequest"
      responses:
        "413":
          $ref: "#/components/responses/body_too_large"
        "204":
          description: Nothing about the subject remains in the organization.
        "400":
          $ref: "#/components/responses/invalid_query"
        "401":
          $ref: "#/components/responses/unauthenticated"
        "403":
          $ref: "#/components/responses/forbidden"
        "429":
          $ref: "#/components/responses/rate_limited"
        "500":
          $ref: "#/components/responses/internal"
        "503":
          $ref: "#/components/responses/service_unavailable"
  /v1/explanations:
    get:
      operationId: getExplanation
      summary: Explain one prediction
      description: >-
        Takes one action's prediction apart in the model's own terms (spec
        009): the answers that moved it most, each with its exact share of
        the model's latent mean, the split of that mean into what the model
        knows about this kind of action and about the person lately, and
        for an ask whether it comes from too few answers (unsure) or from
        the person's answers with the probability still inside the ask
        band (split). The explanation is by the person's current model;
        predicted_by names the model that made the recorded prediction, so
        a client can say the model has learned since. A decision point
        never shows an explanation to an agent.
      x-limen-action: case.list
      x-limen-resource:
        kind: Case
        fields: [org, subject]
      parameters:
      - $ref: "#/components/parameters/org"
      - $ref: "#/components/parameters/subject"
      - name: action_id
        in: query
        required: true
        schema:
          type: string
      responses:
        "200":
          description: The explanation.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Explanation"
        "400":
          $ref: "#/components/responses/invalid_query"
        "401":
          $ref: "#/components/responses/unauthenticated"
        "403":
          $ref: "#/components/responses/forbidden"
        "404":
          $ref: "#/components/responses/no_case"
        "429":
          $ref: "#/components/responses/rate_limited"
        "500":
          $ref: "#/components/responses/internal"
        "503":
          $ref: "#/components/responses/service_unavailable"
  /v1/learned:
    get:
      operationId: getLearned
      summary: Show what the model learned
      description: >-
        What the model has learned about one person: for each kind of action
        they answered, named by its label, how often they approved and
        denied it and what the model suggests now under the profile that
        applies, with the evidence ratio and kind of uncertainty of an ask;
        and the shared tolerance part over their decisions, for a trend.
      x-limen-action: case.list
      x-limen-resource:
        kind: Case
        fields: [org, subject]
      parameters:
      - $ref: "#/components/parameters/org"
      - $ref: "#/components/parameters/subject"
      - name: agent
        in: query
        required: false
        description: The agent whose profile applies, with kind; empty applies the organization's.
        schema:
          type: string
      - name: kind
        in: query
        required: false
        description: Only the entries of this action kind.
        schema:
          type: string
      responses:
        "200":
          description: What the model learned.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Learned"
        "400":
          $ref: "#/components/responses/invalid_query"
        "401":
          $ref: "#/components/responses/unauthenticated"
        "403":
          $ref: "#/components/responses/forbidden"
        "429":
          $ref: "#/components/responses/rate_limited"
        "500":
          $ref: "#/components/responses/internal"
        "503":
          $ref: "#/components/responses/service_unavailable"
  /v1/previews:
    post:
      operationId: createPreview
      summary: Preview another profile
      description: >-
        What other costs would have done with one person's recorded
        predictions in a window: the predictions as they were made,
        re-thresholded under the costs' thresholds, with no model refitted.
        Costs are checked as a profile's are.
      x-limen-action: reliability.read
      x-limen-resource:
        kind: Reliability
        fields: [org, subject]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PreviewRequest"
      responses:
        "200":
          description: The preview.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Preview"
        "400":
          $ref: "#/components/responses/invalid_query"
        "413":
          $ref: "#/components/responses/body_too_large"
        "422":
          $ref: "#/components/responses/ask_too_costly"
        "401":
          $ref: "#/components/responses/unauthenticated"
        "403":
          $ref: "#/components/responses/forbidden"
        "429":
          $ref: "#/components/responses/rate_limited"
        "500":
          $ref: "#/components/responses/internal"
        "503":
          $ref: "#/components/responses/service_unavailable"
components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: A token from an issuer this installation lists, carrying the audience it verifies.
  parameters:
    org:
      name: org
      in: query
      required: true
      schema:
        type: string
    subject:
      name: subject
      in: query
      required: true
      schema:
        type: string
    kind:
      name: kind
      in: query
      description: The kind of action a profile is scoped to.
      schema:
        type: string
    agent:
      name: agent
      in: query
      description: The agent a profile is scoped to.
      schema:
        type: string
    profileSubject:
      name: subject
      in: query
      description: The person whose own profile in the organization this is. It excludes kind and agent, and in the context of a person it equals org.
      schema:
        type: string
  schemas:
    Verdict:
      type: string
      description: What a decision point does with an action, ordered from most to least permissive. Composing verdicts keeps the least permissive one.
      enum: [allow, flag, ask, block]
    Suggestion:
      type: string
      description: Limen's suggestion. Limen never suggests flag; a flag is the decision point's, when it draws a review.
      enum: [allow, ask, block]
    Probability:
      type: number
      minimum: 0
      maximum: 1
    Action:
      type: object
      description: One proposed action, described by what the decision point can observe before it runs.
      properties:
        org:
          type: string
          description: The organization whose cost profile applies and whose records these are.
        subject:
          type: string
          description: The person on whose behalf the action runs and whose approvals Limen learns, as the issuer and the token's sub joined by a pipe.
          examples:
          - https://issuer.example|usr_42
        action_id:
          type: string
          description: The decision point's own id for the action, unique within the organization and subject.
          examples:
          - ses_9f/toolu_01
        actor:
          $ref: "#/components/schemas/Actor"
        kind:
          type: string
          description: The domain of the action.
          examples:
          - tool
          - egress
          - repo
          - spend
        name:
          type: string
          description: The operation within the kind.
          examples:
          - bash
          - mcp__github__merge_pull_request
          - ref.update
        effect:
          type: string
          description: The widest effect the action can have.
          enum: [none, read, write, external]
        reversible:
          type: boolean
          description: Whether the action can be undone, when known.
        input:
          description: The action's input. Only deterministic feature extractors read it; Limen never stores it.
        target:
          $ref: "#/components/schemas/Target"
        environment:
          $ref: "#/components/schemas/Environment"
        scope:
          $ref: "#/components/schemas/ReachClaim"
        attributes:
          type: object
          description: Further observable facts the domain has. Values are strings, finite numbers, or booleans.
          maxProperties: 64
          additionalProperties:
            type: [string, number, boolean]
        signals:
          type: array
          items:
            $ref: "#/components/schemas/Signal"
      required: [org, subject, action_id, kind, name, effect]
    Actor:
      type: object
      description: Who proposed the action.
      properties:
        kind:
          type: string
          examples:
          - agent
          - service
          - person
        id:
          type: string
        session:
          type: string
          description: The run the action belongs to, for example an agent's session. The cover rule counts the sessions of a person's approvals by it, and the weight of an answer counts the reviews before it in its session. An action without it counts as the UTC day it was received. Limen never reads a session out of action_id.
      required: [kind]
    Target:
      type: object
      properties:
        kind:
          type: string
          examples:
          - path
          - ref
          - host
          - account
        id:
          type: string
        sensitivity:
          $ref: "#/components/schemas/Probability"
          description: From 0, a scratch directory, to 1, production.
        class:
          type: string
          description: The class of the target, a claim of the scope. A word outside the list is a claim of unknown, and it is not an error.
          examples:
          - scratch
          - own
          - shared
          - primary
      required: [kind, id]
    Environment:
      type: object
      properties:
        kind:
          type: string
          examples:
          - host
          - sandbox
          - service
        credentialed:
          type: boolean
          description: The environment holds a credential that reaches outside it.
        holds:
          type: array
          description: The limits the environment enforces, so a reach cannot occur. Each bounds Limen's reading of the input. egress, no host outside the session's network is reachable without its own approval, so crosses.network is no; protected_refs, the git host refuses a push to a protected branch, so a primary class read from a git push is unknown; checkpoints, a copy of the workspace can restore it, so an action that crosses no boundary is at most recoverable. A hold outside the list is no hold.
          items:
            type: string
            examples:
            - egress
            - protected_refs
            - checkpoints
        repositories:
          type: string
          description: The visibility of the repositories the session pushes to, which is the visibility of a git push. Another word is unknown.
          examples:
          - private
          - public
          - mixed
      required: [kind, credentialed]
    Signal:
      type: object
      description: Another opinion about the action, treated as evidence. It carries a verdict, a score, or both.
      properties:
        source:
          type: string
          examples:
          - rules/1
          - classifier/claude-auto-mode
        verdict:
          $ref: "#/components/schemas/Verdict"
        score:
          $ref: "#/components/schemas/Probability"
      required: [source]
      anyOf:
      - required: [verdict]
      - required: [score]
    Prediction:
      type: object
      description: Limen's opinion about one action, for the decision point to compose with its own rules.
      properties:
        org:
          type: string
        subject:
          type: string
        action_id:
          type: string
        verdict:
          $ref: "#/components/schemas/Suggestion"
          description: The verdict the thresholds give approve, except that an allow the person's approvals do not cover is an ask, of ask_kind wider or few.
        approve:
          $ref: "#/components/schemas/Probability"
          description: The probability that the subject approves the action.
        uncertainty:
          type: number
          minimum: 0
          description: The posterior standard deviation of the latent tolerance behind approve.
        evidence_ratio:
          type: number
          minimum: 0
          maximum: 1
          description: The share of the prior variance at the action that the subject's answers removed.
        ask_kind:
          $ref: "#/components/schemas/AskKind"
          description: Present when verdict is ask.
        thresholds:
          $ref: "#/components/schemas/Thresholds"
        profile:
          $ref: "#/components/schemas/Scope"
        audit_rate:
          $ref: "#/components/schemas/Probability"
          description: The share of automatic verdicts the profile asks a person to review at random; the rate the decision point passes to its review draw.
        source:
          type: string
          examples:
          - learned/1
        reason:
          type: string
          description: One sentence for the person who reads the record. Never shown to an agent. For an allow or a block it gives the approval probability; for an ask it states no probability and no direction, so it does not lead the person who reads it when Limen asks.
        scope:
          $ref: "#/components/schemas/Reach"
          description: The reach of the action as Limen used it. Absent from a prediction that FailClosed made.
        cover:
          $ref: "#/components/schemas/Cover"
          description: The cover rule for the action. Absent from a prediction that FailClosed made.
        minimum:
          $ref: "#/components/schemas/Minimum"
      required: [org, subject, action_id, verdict, approve, uncertainty, evidence_ratio, thresholds, profile, audit_rate, source, reason]
    Minimum:
      type: object
      deprecated: true
      description: The answer minimum of v0.6, the interim rule that the cover rule replaced. Limen no longer sets it; read cover.
      properties:
        allows:
          type: integer
          minimum: 0
        sessions:
          type: integer
          minimum: 0
        min_allows:
          type: integer
          minimum: 0
        min_sessions:
          type: integer
          minimum: 0
      required: [allows, sessions, min_allows, min_sessions]
    ReachClaim:
      type: object
      description: >-
        What the decision point knows about the reach of the action, in the
        words of the lists alone, never with a path, a host, a ref name or
        other text of the input. Limen also reads the reach from the input
        and the fields of the action, and takes the greater of each claim
        and its reading, or the greatest value when the two are not
        comparable: a claim makes the scope wider and never narrower. A
        member left out is no claim. A word outside its list is a claim of
        unknown, and it is not an error.
      properties:
        undo:
          type: string
          description: Whether the action can be undone.
          examples:
          - none
          - reversible
          - recoverable
          - irreversible
        crosses:
          $ref: "#/components/schemas/Crosses"
        contact:
          type: string
          description: Whether the action is the first contact with its target.
          examples:
          - first
          - repeat
    Crosses:
      type: object
      description: The boundaries an action crosses, each true for yes and false for no. A boundary that is not known has no key. A value that is not a boolean is unknown, and it is not an error. network, organization and public each make remote true.
      properties:
        machine:
          type: boolean
          description: The action changes the machine outside the workspace, for example a home or system path.
        remote:
          type: boolean
          description: The action reaches a system other than the machine.
        network:
          type: boolean
          description: The action reaches a host outside the network of the session.
        organization:
          type: boolean
          description: The action reaches a party that the organization does not own.
        public:
          type: boolean
          description: The action makes something readable by anyone.
    Reach:
      type: object
      description: >-
        The scope of an action as Limen used it: its reading of the input,
        bounded by the holds of the environment, merged with the claims.
        Each dimension has a value, unknown included; an unknown boundary
        of crosses has no key. It holds words of the lists alone.
      properties:
        undo:
          $ref: "#/components/schemas/Undo"
        crosses:
          $ref: "#/components/schemas/Crosses"
        target_class:
          $ref: "#/components/schemas/TargetClass"
        contact:
          $ref: "#/components/schemas/Contact"
        target_kind:
          type: string
          description: The kind of the target without its name, the target's kind or a kind the segments of a shell action name.
          examples:
          - ref
          - repository
          - package
          - host
          - path
          - app
      required: [undo, crosses, target_class, contact]
    Undo:
      type: string
      description: Whether an action can be undone, from the least reach to the most, or unknown.
      enum: [none, reversible, recoverable, irreversible, unknown]
    TargetClass:
      type: string
      description: The class of what an action changes, from the least reach to the most, or unknown.
      enum: [scratch, own, shared, primary, unknown]
    Contact:
      type: string
      description: Whether an action is the first contact with its target, or unknown. It is not in the order of scopes.
      enum: [repeat, first, unknown]
    Cover:
      type: object
      description: >-
        The cover rule for an action. An approval covers it when its latest
        answer approves, it shares a family with the action, and the scope
        of the action is within its scope. The action is covered when, in
        each family, the covering approvals with weight have min_weight or
        more in total, from min_sessions or more sessions. An allow that is
        not covered is an ask.
      properties:
        covered:
          type: boolean
        weight:
          type: number
          minimum: 0
          description: The total weight of the covering approvals, for the family with the least weight; if a family misses a setting, only those families are compared.
        sessions:
          type: integer
          minimum: 0
          description: The sessions of the covering approvals with weight, for that family.
        min_weight:
          type: integer
          minimum: 0
          description: The setting that applied, the greater of the installation's and the cost profile's. 3 by default.
        min_sessions:
          type: integer
          minimum: 0
          description: The setting that applied, the greater of the installation's and the cost profile's. 2 by default.
      required: [covered, weight, sessions, min_weight, min_sessions]
    ExplainedCover:
      type: object
      description: The cover of an explanation, with the approvals nearest to covering the action.
      properties:
        covered:
          type: boolean
        weight:
          type: number
          minimum: 0
        sessions:
          type: integer
          minimum: 0
        min_weight:
          type: integer
          minimum: 0
        min_sessions:
          type: integer
          minimum: 0
        nearest:
          type: array
          maxItems: 3
          description: Up to three approved cases of a family of the action whose scope the action exceeds, closest first, so a client can say "You allowed publish, update. This is publish, make public."
          items:
            $ref: "#/components/schemas/Approval"
      required: [covered, weight, sessions, min_weight, min_sessions]
    Approval:
      type: object
      properties:
        action_id:
          type: string
        label:
          type: string
        at:
          type: string
          format: date-time
          description: The time of the latest answer of the case.
      required: [action_id, label, at]
    Consent:
      type: object
      description: The settings of the cover rule for the actions in the scope. A profile can make the settings of the installation greater and never smaller. 0, or no value, is the setting of the installation.
      properties:
        min_weight:
          type: integer
          minimum: 0
        min_sessions:
          type: integer
          minimum: 0
    Thresholds:
      type: object
      description: Above allow_above is an allow, below block_below a block, and everything between, both ends included, an ask.
      properties:
        allow_above:
          $ref: "#/components/schemas/Probability"
        block_below:
          $ref: "#/components/schemas/Probability"
      required: [allow_above, block_below]
    Scope:
      type: object
      description: >-
        What a profile applies to. A scope with subject is the person's own
        profile in the organization: it has no kind and no agent. On a
        prediction, subject says that the person's own profile made the
        organization's stricter.
      properties:
        org:
          type: string
        kind:
          type: string
        agent:
          type: string
        subject:
          type: string
          description: The person whose own profile this is. In the context of a person, an org with a pipe, it equals org.
      required: [org]
    Decision:
      type: object
      description: What a decision point did with one action, recorded once, before the action runs or a person sees it.
      properties:
        org:
          type: string
        subject:
          type: string
        action_id:
          type: string
        verdict:
          $ref: "#/components/schemas/Verdict"
        review_probability:
          $ref: "#/components/schemas/Probability"
          description: >-
            The probability, fixed before the action ran, that a person sees
            it: positive for flag and ask, below one for allow and block. An
            answer to the action counts with weight one over it.
        source:
          type: string
          description: The policy that decided.
          examples:
          - topos/progressive
          - rules/1
        action:
          $ref: "#/components/schemas/Action"
      required: [org, subject, action_id, verdict, review_probability, source]
    Answer:
      type: object
      properties:
        org:
          type: string
        subject:
          type: string
        action_id:
          type: string
        approve:
          type: boolean
        by:
          type: string
          description: Who answered, when the caller relays the answer for someone else. Honored only when the authorizer allows the relay.
        answer_ms:
          $ref: "#/components/schemas/AnswerMS"
        waited_ms:
          $ref: "#/components/schemas/WaitedMS"
        details_opened:
          $ref: "#/components/schemas/DetailsOpened"
        suggestion_shown:
          $ref: "#/components/schemas/SuggestionShown"
        surface:
          $ref: "#/components/schemas/Surface"
        remembered:
          $ref: "#/components/schemas/Remembered"
      required: [org, subject, action_id, approve]
    AnswerMS:
      type: integer
      minimum: 0
      maximum: 86400000
      description: How the person answered. The milliseconds from the moment the question was visible to the person to the answer, measured by the client.
    WaitedMS:
      type: integer
      minimum: 0
      description: How the person answered. The milliseconds from the decision that showed the action to the answer, measured by the decision point.
    DetailsOpened:
      type: boolean
      description: How the person answered. True if the person opened the details of the action (the full input, the change, the target) before the answer; false if the client offered them and the person did not open them.
    SuggestionShown:
      type: boolean
      description: How the person answered. True if the client showed the suggestion of Limen (the verdict, the approval probability, the reason, or an explanation) before the answer.
    Surface:
      type: string
      description: How the person answered. Where the person answered. A surface outside the list is no surface, and it is not an error.
      examples:
      - prompt
      - notification
      - queue
      - bulk
      - rule
    Remembered:
      type: boolean
      description: How the person answered. True if the answer also made a standing rule for later actions. The rule itself is never sent.
    Case:
      type: object
      description: Everything Limen holds about one action.
      properties:
        action:
          $ref: "#/components/schemas/Action"
          description: The action, without its input, which Limen never stores.
        prediction:
          $ref: "#/components/schemas/Prediction"
        decision:
          $ref: "#/components/schemas/Decision"
        answers:
          type: array
          items:
            $ref: "#/components/schemas/RecordedAnswer"
      required: [action]
    RecordedAnswer:
      type: object
      properties:
        approve:
          type: boolean
        by:
          type: string
        at:
          type: string
          format: date-time
        review:
          type: boolean
          description: True for the answer that reviews an action the decision showed a person, the one answer that enters error estimates.
        answer_ms:
          $ref: "#/components/schemas/AnswerMS"
        waited_ms:
          $ref: "#/components/schemas/WaitedMS"
        details_opened:
          $ref: "#/components/schemas/DetailsOpened"
        suggestion_shown:
          $ref: "#/components/schemas/SuggestionShown"
        surface:
          $ref: "#/components/schemas/Surface"
        remembered:
          $ref: "#/components/schemas/Remembered"
      required: [approve, by, at, review]
    Page:
      type: object
      description: One page of cases. next_cursor is present only when a further page exists.
      properties:
        entries:
          type: array
          items:
            $ref: "#/components/schemas/Case"
        next_cursor:
          type: string
      required: [entries]
    Profile:
      type: object
      description: >-
        What an organization states about errors and interruptions for the
        actions in a scope. With subject, it is one person's own profile in
        the organization, which only makes the organization's stricter for
        that person: a prediction applies the meet of the two.
      properties:
        org:
          type: string
        kind:
          type: string
        agent:
          type: string
        subject:
          type: string
          description: The person whose own profile this is. A profile with subject has no kind and no agent.
        costs:
          $ref: "#/components/schemas/Costs"
        audit_rate:
          $ref: "#/components/schemas/Probability"
        certify:
          $ref: "#/components/schemas/Certify"
          description: The claim reliability reports test. Omitted, it is a false-allow rate below 1% at 95% confidence, which takes 300 clean reviews.
        consent:
          $ref: "#/components/schemas/Consent"
        thresholds:
          $ref: "#/components/schemas/Thresholds"
          readOnly: true
        default:
          type: boolean
          readOnly: true
          description: True for the built-in profile Limen applies to a scope with no saved profile.
      required: [org, costs, audit_rate, thresholds]
    Costs:
      type: object
      description: The three prices of a decision, in any one unit. Only their ratios matter. Each kind of error must cost more than two interruptions.
      properties:
        false_allow:
          type: number
          exclusiveMinimum: 0
          description: The cost of running an action the person would deny.
        false_block:
          type: number
          exclusiveMinimum: 0
          description: The cost of refusing an action the person would approve.
        ask:
          type: number
          exclusiveMinimum: 0
          description: The cost of one interruption.
      required: [false_allow, false_block, ask]
    Certify:
      type: object
      description: The claim a reliability report tests, a false-allow rate below alpha at confidence 1 - delta.
      properties:
        alpha:
          type: number
          exclusiveMinimum: 0
          maximum: 1
        delta:
          type: number
          exclusiveMinimum: 0
          exclusiveMaximum: 1
      required: [alpha, delta]
    Reliability:
      type: object
      properties:
        org:
          type: string
        subject:
          type: string
        of:
          type: string
        from:
          type: string
          format: date-time
        to:
          type: string
          format: date-time
        false_allow:
          $ref: "#/components/schemas/Estimate"
        false_block:
          $ref: "#/components/schemas/Estimate"
        certificate:
          $ref: "#/components/schemas/Certificate"
      required: [org, subject, of, from, to, false_allow, false_block, certificate]
    Estimate:
      type: object
      properties:
        value:
          type: [number, "null"]
          minimum: 0
          description: Null when no action in the window could have been reviewed. Null means unknown, not zero.
        interval:
          type: array
          items:
            type: number
          minItems: 2
          maxItems: 2
          description: A 95% interval, present with value.
        covered:
          $ref: "#/components/schemas/Probability"
          description: The share of the source's allows (or blocks) in the window whose review probability was positive; the estimate speaks for that share only.
        reviews:
          type: integer
          minimum: 0
        audits:
          type: integer
          minimum: 0
          description: Reviews whose review probability was below one.
        unanswered:
          type: integer
          minimum: 0
          description: Actions a decision showed a person that have no review yet.
      required: [value, covered, reviews, audits, unanswered]
    Certificate:
      type: object
      properties:
        alpha:
          type: number
        delta:
          type: number
        clean:
          type: integer
          minimum: 0
          description: Consecutive audited allows, most recent first, that the person approved.
        needed:
          type: integer
          minimum: 1
          description: ceil(ln(1/delta)/alpha); 300 for alpha 0.01 and delta 0.05.
        holds:
          type: boolean
        considered:
          type: integer
          minimum: 0
          description: The audits of the clean run whose answer is considered, with weight 1 under weights/1. The claim does not read it; it shows whether the certificate rests on quick answers.
      required: [alpha, delta, clean, needed, holds, considered]
    ReplayRecord:
      type: object
      description: One recorded action, one per line.
      properties:
        at:
          type: string
          format: date-time
        action:
          $ref: "#/components/schemas/Action"
        verdict:
          $ref: "#/components/schemas/Verdict"
        review_probability:
          $ref: "#/components/schemas/Probability"
        source:
          type: string
        approve:
          type: boolean
          description: The person's answer; absent when there was none.
        answered_at:
          type: string
          format: date-time
          description: When the person answered, not before at. Without it the answer is at at, so the time Limen measures is 0 and the approval builds no cover.
        answer_ms:
          $ref: "#/components/schemas/AnswerMS"
        waited_ms:
          $ref: "#/components/schemas/WaitedMS"
        details_opened:
          $ref: "#/components/schemas/DetailsOpened"
        suggestion_shown:
          $ref: "#/components/schemas/SuggestionShown"
        surface:
          $ref: "#/components/schemas/Surface"
        remembered:
          $ref: "#/components/schemas/Remembered"
      required: [at, action, verdict, review_probability, source]
    ReplayReport:
      type: object
      properties:
        records:
          type: integer
        answered:
          type: integer
        would:
          type: object
          description: Limen's suggestions on the records, counted by verdict.
          propertyNames:
            $ref: "#/components/schemas/Suggestion"
          additionalProperties:
            type: integer
        allowed_denied:
          type: integer
        blocked_approved:
          type: integer
        false_allow:
          $ref: "#/components/schemas/Estimate"
        kept:
          type: boolean
      required: [records, answered, would, allowed_denied, blocked_approved, false_allow, kept]
    ModelRef:
      type: object
      description: One fitted model of a person, the source of its predictions and the number of the person's answers it was fitted through.
      properties:
        source:
          type: string
        answers:
          type: integer
          minimum: 0
      required: [source, answers]
    AskKind:
      type: string
      description: >-
        Why a suggestion is an ask. In the ask band: unsure, an evidence
        ratio below 0.5, little evidence that more answers can move; split,
        0.5 or more, and in a family of the action the latest answers of the
        person hold an approval and a denial; short, 0.5 or more, and the
        answers of each family agree but are not enough yet. For an allow
        the cover rule turned into an ask: wider, the person never allowed
        an action of this reach; few, the person allowed this reach, but
        not with enough considered approvals or not in enough sessions. A
        decision point can let its rules decide unsure, short and few, and
        keep split and wider for the person. A decision point reads a kind
        it does not know as unsure.
      enum: [unsure, split, short, wider, few]
    Parts:
      type: object
      description: The latent mean split by the additive model's terms; they sum to the mean.
      properties:
        action:
          type: number
          description: What the model knows about this kind of action at any time.
        recent:
          type: number
          description: The person's tolerance lately, which every answer moves whatever its action.
        interaction:
          type: number
      required: [action, recent, interaction]
    Evidence:
      type: object
      description: One answer's share of an explanation. An approval pushed toward running, a denial toward stopping.
      properties:
        action_id:
          type: string
        label:
          type: string
          description: The answered action's label, from the featurizer's closed vocabulary, never from the input.
        at:
          type: string
          format: date-time
        approve:
          type: boolean
        share:
          $ref: "#/components/schemas/Probability"
          description: The answer's absolute contribution over the sum of all absolute contributions.
      required: [action_id, label, at, approve, share]
    Explanation:
      type: object
      description: One prediction taken apart in the model's own terms (spec 009).
      properties:
        org:
          type: string
        subject:
          type: string
        action_id:
          type: string
        model:
          $ref: "#/components/schemas/ModelRef"
        predicted_by:
          $ref: "#/components/schemas/ModelRef"
        approve:
          $ref: "#/components/schemas/Probability"
        uncertainty:
          type: number
          minimum: 0
        verdict:
          $ref: "#/components/schemas/Suggestion"
          description: The verdict the thresholds give approve, held to the cover rule by the person's approvals now.
        thresholds:
          $ref: "#/components/schemas/Thresholds"
        cover:
          $ref: "#/components/schemas/ExplainedCover"
        minimum:
          $ref: "#/components/schemas/Minimum"
        reason:
          type: string
          description: One sentence for the person, saying why verdict is what it is, as a prediction's reason does. An older server does not send it.
        mean:
          type: number
          description: The model's latent mean at the action; approve is its probit after the uncertainty.
        parts:
          $ref: "#/components/schemas/Parts"
        evidence_ratio:
          type: number
          minimum: 0
          maximum: 1
          description: The share of the prior variance the person's answers removed at this action.
        ask_kind:
          $ref: "#/components/schemas/AskKind"
        evidence:
          type: array
          items:
            $ref: "#/components/schemas/Evidence"
          description: Up to three answers toward the verdict's side and two against it, or three each way for an ask, by share.
      required: [org, subject, action_id, model, approve, uncertainty, verdict, thresholds, mean, evidence_ratio, evidence]
    LearnedEntry:
      type: object
      description: One kind of action the person answered, and what the model suggests for it now.
      properties:
        label:
          type: string
        kind:
          type: string
        name:
          type: string
        approved:
          type: integer
          minimum: 0
        denied:
          type: integer
          minimum: 0
        approve:
          $ref: "#/components/schemas/Probability"
        uncertainty:
          type: number
          minimum: 0
        verdict:
          $ref: "#/components/schemas/Suggestion"
          description: The verdict the thresholds give approve, held to the cover rule.
        evidence_ratio:
          type: number
          minimum: 0
          maximum: 1
        ask_kind:
          $ref: "#/components/schemas/AskKind"
        thresholds:
          $ref: "#/components/schemas/Thresholds"
        cover:
          $ref: "#/components/schemas/Cover"
        minimum:
          $ref: "#/components/schemas/Minimum"
      required: [label, kind, name, approved, denied, approve, uncertainty, verdict, evidence_ratio, thresholds]
    TrendPoint:
      type: object
      properties:
        t:
          type: integer
          minimum: 0
          description: The decision's ordinal in the person's history.
        at:
          type: string
          format: date-time
        value:
          type: number
          description: The shared tolerance part of the model at that decision.
      required: [t, at, value]
    Learned:
      type: object
      description: What the model has learned about one person.
      properties:
        org:
          type: string
        subject:
          type: string
        model:
          $ref: "#/components/schemas/ModelRef"
        entries:
          type: array
          items:
            $ref: "#/components/schemas/LearnedEntry"
        recent:
          type: array
          maxItems: 20
          items:
            $ref: "#/components/schemas/TrendPoint"
      required: [org, subject, model, entries, recent]
    PreviewRequest:
      type: object
      properties:
        org:
          type: string
        subject:
          type: string
        from:
          type: string
          format: date-time
        to:
          type: string
          format: date-time
        costs:
          $ref: "#/components/schemas/Costs"
        audit_rate:
          $ref: "#/components/schemas/Probability"
      required: [org, subject, from, to, costs, audit_rate]
    Preview:
      type: object
      description: What the previewed costs would have done with the recorded predictions in the window.
      properties:
        org:
          type: string
        subject:
          type: string
        from:
          type: string
          format: date-time
        to:
          type: string
          format: date-time
        costs:
          $ref: "#/components/schemas/Costs"
        audit_rate:
          $ref: "#/components/schemas/Probability"
        thresholds:
          $ref: "#/components/schemas/Thresholds"
        records:
          type: integer
        would:
          type: object
          description: The recorded predictions in the window, counted by the verdict the thresholds give them.
          propertyNames:
            $ref: "#/components/schemas/Suggestion"
          additionalProperties:
            type: integer
        answered:
          type: integer
        allowed_denied:
          type: integer
        blocked_approved:
          type: integer
        expected_asks:
          type: number
          description: The asks, plus the audits the audit rate would draw from the automatic verdicts.
      required: [org, subject, from, to, costs, audit_rate, thresholds, records, would, answered, allowed_denied, blocked_approved, expected_asks]
    WeekState:
      type: string
      description: open until 7 days after the end of the week; too_few when it closed with fewer than 5 persons; ready when it closed with 5 or more.
      enum: [open, too_few, ready]
    Report:
      type: object
      description: >-
        The report of an organization, one entry per week, oldest first. It
        names no person, no action and no time finer than a week; the only
        names in it are agent ids. A week a report showed never changes.
      properties:
        org:
          type: string
        from:
          type: string
          format: date-time
        to:
          type: string
          format: date-time
        min_subjects:
          type: integer
          description: The minimum group, 5.
        weeks:
          type: array
          items:
            $ref: "#/components/schemas/WeekReport"
      required: [org, from, to, min_subjects, weeks]
    WeekReport:
      type: object
      description: >-
        One week. An open or too_few week has from, to and state alone. A
        ready week has total, and agents and other when it divides by
        agent; their counts add up to those of total.
      properties:
        from:
          type: string
          format: date-time
        to:
          type: string
          format: date-time
        state:
          $ref: "#/components/schemas/WeekState"
        total:
          $ref: "#/components/schemas/ReportCell"
        agents:
          type: array
          description: One cell for each agent with 5 or more persons in the week, by agent id.
          items:
            $ref: "#/components/schemas/AgentCell"
        other:
          $ref: "#/components/schemas/ReportCell"
          description: Every other case of the week, the agents with no cell of their own and the cases with no agent. Absent when there are none.
      required: [from, to, state]
    ReportCell:
      type: object
      description: >-
        The numbers of one group of a week's cases. A field read from
        reviews shows only when its reviews come from 5 or more persons and
        no person gave more than half of them; otherwise it is absent and
        its path is in withheld.
      properties:
        subjects:
          type: integer
          minimum: 5
          description: The persons with a decided case in the cell.
        decisions:
          $ref: "#/components/schemas/VerdictCounts"
        flag_reviews:
          $ref: "#/components/schemas/FlagReviews"
        applied:
          $ref: "#/components/schemas/SourceRates"
        learned:
          $ref: "#/components/schemas/SourceRates"
        withheld:
          type: array
          items:
            type: string
            enum: [flag_reviews.denied, applied.false_allow, applied.false_block, learned.false_allow, learned.false_block]
      required: [subjects, decisions, flag_reviews, applied, learned, withheld]
    AgentCell:
      type: object
      description: The cell of one agent, named by the actor id of its cases. Its other fields are those of ReportCell.
      properties:
        agent:
          type: string
        subjects:
          type: integer
          minimum: 5
        decisions:
          $ref: "#/components/schemas/VerdictCounts"
        flag_reviews:
          $ref: "#/components/schemas/FlagReviews"
        applied:
          $ref: "#/components/schemas/SourceRates"
        learned:
          $ref: "#/components/schemas/SourceRates"
        withheld:
          type: array
          items:
            type: string
            enum: [flag_reviews.denied, applied.false_allow, applied.false_block, learned.false_allow, learned.false_block]
      required: [agent, subjects, decisions, flag_reviews, applied, learned, withheld]
    VerdictCounts:
      type: object
      description: Decided cases by the verdict applied.
      properties:
        allow:
          type: integer
          minimum: 0
        flag:
          type: integer
          minimum: 0
        ask:
          type: integer
          minimum: 0
        block:
          type: integer
          minimum: 0
      required: [allow, flag, ask, block]
    FlagReviews:
      type: object
      properties:
        reviews:
          type: integer
          minimum: 0
          description: The cases with the verdict flag applied that have a review from before the week closed.
        denied:
          type: integer
          minimum: 0
          description: The reviews among them that denied the action. Absent when withheld.
      required: [reviews]
    SourceRates:
      type: object
      description: One source's error rates in a cell, each one estimate over every case of the cell. A review after the week closed counts as unanswered. A rate is absent when withheld; a rate with no review has value null.
      properties:
        false_allow:
          $ref: "#/components/schemas/Estimate"
        false_block:
          $ref: "#/components/schemas/Estimate"
    ForgetRequest:
      type: object
      properties:
        org:
          type: string
        subject:
          type: string
      required: [org, subject]
    Error:
      type: object
      description: The one error shape of this API. A caller branches on error.code and shows error.message.
      properties:
        error:
          type: object
          properties:
            code:
              type: string
              description: The stable identifier of the row of the error table.
            message:
              type: string
              description: The one sentence of that row, fixed and shown to a person.
            details:
              type: object
              description: "What varies: always request_id, the developer sentence in detail, and the field paths at fault in fields."
              properties:
                request_id:
                  type: string
                detail:
                  type: string
                fields:
                  type: array
                  items:
                    type: string
          required: [code, message]
      required: [error]
  responses:
    service_unavailable:
      description: "503 unavailable or authorizer_unavailable: Limen, or the permission service it asks, is unavailable; a decision point holds the action for a person."
      x-limen-codes: [unavailable, authorizer_unavailable]
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    invalid_action:
      description: "400 invalid_action: The action has a missing field or a value that is not permitted. Correct the fields that the details list, then send the action again."
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    invalid_decision:
      description: "400 invalid_decision: The decision has a missing field or a value that is not permitted. Correct the fields that the details list, then send the decision again."
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    invalid_answer:
      description: "400 invalid_answer: The answer has a missing field or a value that is not permitted. Correct the fields that the details list, then send the answer again."
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    invalid_profile:
      description: "400 invalid_profile: The cost profile has a missing field or a value that is not permitted. Correct the fields that the details list, then save the cost profile again."
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    invalid_query:
      description: "400 invalid_query: The request has a missing field or a value that is not permitted. Correct the fields that the details list, then send the request again."
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    invalid_replay:
      description: "400 invalid_replay: A replayed record has a missing field or a value that is not permitted. Correct the records that the details list, then send the replay again."
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    ask_too_costly:
      description: "422 ask_too_costly: With these costs, Limen would not ask about an action of a person that it has no answers from. Make the cost of each type of error more than two times the cost of an ask."
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    action_conflict:
      description: "409 action_conflict: A different action already uses this action ID. Give each action its own ID."
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    already_decided:
      description: "409 already_decided: This action already has a decision. Limen accepts one decision for each action."
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    no_decision:
      description: "409 no_decision: This action has no recorded decision. Record the decision, then send the answer."
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    no_case:
      description: "404 no_case: Limen has no record of this action. Check the organization, the person, and the action ID."
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    unauthenticated:
      description: "401 unauthenticated: The request has no valid credential. Sign in again, then send the request again."
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    forbidden:
      description: "403 forbidden: You do not have permission for this request. Ask an administrator of the organization for access."
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    body_too_large:
      description: "413 body_too_large: The request is larger than the limit of Limen. Send it in smaller parts."
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    rate_limited:
      description: "429 rate_limited: There are too many requests. Wait a short time, then send the request again."
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    internal:
      description: "500 internal: Limen had an internal failure. Send the request again. If the failure continues, report it with the request ID."
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    authorizer_unavailable:
      description: "503 authorizer_unavailable: The permission service is not available. Send the request again after a short time."
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    unavailable:
      description: "503 unavailable: Limen is not available now. Hold the action for a person, and send the request again after a short time."
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
