openapi: 3.1.0
info:
  title: Limen
  version: "1"
  summary: The oversight layer for automated actions.
  description: >-
    Limen serves the decision point that lets an automated action run or
    not: an agent's tool call, a network request, a push, a payment. It
    predicts, for the person on whose behalf the action runs, the
    probability that they would approve it and suggests a verdict from the
    costs their organization states; it keeps a ledger of what each decision
    point decided, with the probability that a person saw the action, and
    of the person's answers; and it reports how often any source of
    decisions allows what the person would deny. The decision point decides
    and draws reviews itself; Limen never applies a verdict. Every record is
    keyed by the organization, the subject, and the decision point's own id
    for the action. The server serves these routes under /v1; a platform may
    mount them under a prefix of its own. Every route asks the
    installation's authorizer for the action named in x-limen-action, about
    a resource of the kind and with the fields named in x-limen-resource,
    before it acts. Request and response bodies are JSON (the replay upload
    is newline-delimited JSON); a receiver ignores fields it does not know,
    so a newer client can talk to an older server, and validates the fields
    it knows strictly. Where several error codes share a status on one
    route, the response lists them in x-limen-codes.
  license:
    name: Apache-2.0
    identifier: Apache-2.0
security:
- bearer: []
paths:
  /v1/predictions:
    post:
      operationId: predict
      summary: Predict an action
      description: >-
        Limen's prediction for one proposed action: the probability that the
        subject approves it, how uncertain that is, and the verdict it
        suggests under the cost profile that applies. Idempotent on the
        action's key: a repeat with the same action returns the first
        prediction, and a repeat with a different action is refused with
        action_conflict. Limen reads the action's input to extract features
        and never stores it.
      x-limen-action: case.predict
      x-limen-resource:
        kind: Case
        fields: [org, subject]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Action"
      responses:
        "200":
          description: The prediction, new or the one already made for this action.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Prediction"
        "400":
          $ref: "#/components/responses/invalid_action"
        "401":
          $ref: "#/components/responses/unauthenticated"
        "403":
          $ref: "#/components/responses/forbidden"
        "409":
          $ref: "#/components/responses/action_conflict"
        "413":
          $ref: "#/components/responses/body_too_large"
        "429":
          $ref: "#/components/responses/rate_limited"
        "500":
          $ref: "#/components/responses/internal"
        "503":
          $ref: "#/components/responses/service_unavailable"
  /v1/decisions:
    post:
      operationId: recordDecision
      summary: Record a decision
      description: >-
        Record what the decision point did with one action: the verdict it
        applied, the probability, fixed before the action ran, that a person
        sees it, and the policy that decided. Record every decision, not
        only the ones a person sees: a source's allows are the denominator
        of its error rate. An action takes one decision. When Limen holds no
        prediction for the action, as after a fail-closed fallback, the
        decision carries the action.
      x-limen-action: case.decide
      x-limen-resource:
        kind: Case
        fields: [org, subject]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Decision"
      responses:
        "204":
          description: The decision is recorded.
        "400":
          $ref: "#/components/responses/invalid_decision"
        "401":
          $ref: "#/components/responses/unauthenticated"
        "403":
          $ref: "#/components/responses/forbidden"
        "409":
          description: "409 already_decided or action_conflict: the action already has a decision, or the action the decision carries differs from the one predicted."
          x-limen-codes: [already_decided, action_conflict]
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "413":
          $ref: "#/components/responses/body_too_large"
        "429":
          $ref: "#/components/responses/rate_limited"
        "500":
          $ref: "#/components/responses/internal"
        "503":
          $ref: "#/components/responses/service_unavailable"
  /v1/answers:
    post:
      operationId: answer
      summary: Send an answer
      description: >-
        Record a person's answer about an action whose decision is recorded.
        Limen stamps the time. The first answer to an action the decision
        showed a person is its review and enters error estimates; any later
        answer, or an answer to an action nobody was shown, trains the model
        only. A caller that relays an answer for someone else names them in
        by, which is honored only when the authorizer allows the caller to
        answer for the subject.
      x-limen-action: case.answer
      x-limen-resource:
        kind: Case
        fields: [org, subject]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Answer"
      responses:
        "413":
          $ref: "#/components/responses/body_too_large"
        "204":
          description: The answer is recorded.
        "400":
          $ref: "#/components/responses/invalid_answer"
        "401":
          $ref: "#/components/responses/unauthenticated"
        "403":
          $ref: "#/components/responses/forbidden"
        "409":
          $ref: "#/components/responses/no_decision"
        "429":
          $ref: "#/components/responses/rate_limited"
        "500":
          $ref: "#/components/responses/internal"
        "503":
          $ref: "#/components/responses/service_unavailable"
  /v1/cases:
    get:
      operationId: listCases
      summary: List a person's cases
      description: >-
        One subject's cases in one organization, oldest first: each action
        without its input, its prediction, its decision, and its answers.
        With action_id, the one case of that action. With pending=true, the
        review queue: actions a decision showed a person that have no review
        yet.
      x-limen-action: case.list
      x-limen-resource:
        kind: Case
        fields: [org, subject]
      parameters:
      - $ref: "#/components/parameters/org"
      - $ref: "#/components/parameters/subject"
      - name: action_id
        in: query
        schema:
          type: string
      - name: pending
        in: query
        schema:
          type: boolean
          default: false
      - name: cursor
        in: query
        description: The next_cursor of the previous page.
        schema:
          type: string
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 500
          default: 100
      responses:
        "200":
          description: One page of cases.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Page"
        "400":
          $ref: "#/components/responses/invalid_query"
        "401":
          $ref: "#/components/responses/unauthenticated"
        "403":
          $ref: "#/components/responses/forbidden"
        "429":
          $ref: "#/components/responses/rate_limited"
        "500":
          $ref: "#/components/responses/internal"
        "503":
          $ref: "#/components/responses/service_unavailable"
  /v1/reliability:
    get:
      operationId: getReliability
      summary: Report a source's error rates
      description: >-
        How often one source's verdicts disagreed with one person over one
        window: Limen's suggestions (of=learned), the verdicts decision
        points applied (of=applied), one decision source such as rules/1, or
        one signal source such as classifier/claude-auto-mode. Each review
        counts with weight one over its decision's review probability. A
        rate is null, not zero, when no action in the window could have been
        reviewed.
      x-limen-action: reliability.read
      x-limen-resource:
        kind: Reliability
        fields: [org, subject]
      parameters:
      - $ref: "#/components/parameters/org"
      - $ref: "#/components/parameters/subject"
      - name: of
        in: query
        required: true
        schema:
          type: string
          examples:
          - learned
          - applied
          - rules/1
          - classifier/claude-auto-mode
      - name: from
        in: query
        required: true
        schema:
          type: string
          format: date-time
      - name: to
        in: query
        required: true
        schema:
          type: string
          format: date-time
      responses:
        "200":
          description: The report.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Reliability"
        "400":
          $ref: "#/components/responses/invalid_query"
        "401":
          $ref: "#/components/responses/unauthenticated"
        "403":
          $ref: "#/components/responses/forbidden"
        "429":
          $ref: "#/components/responses/rate_limited"
        "500":
          $ref: "#/components/responses/internal"
        "503":
          $ref: "#/components/responses/service_unavailable"
  /v1/profiles:
    get:
      operationId: getProfile
      summary: Read the profile that applies
      description: >-
        The cost profile that applies to a scope: the most specific saved
        profile, in the order kind and agent, agent, kind, organization, or
        the built-in default, which says so in default.
      x-limen-action: profile.read
      x-limen-resource:
        kind: Profile
        fields: [org, action_kind, agent]
      parameters:
      - $ref: "#/components/parameters/org"
      - name: kind
        in: query
        schema:
          type: string
      - name: agent
        in: query
        schema:
          type: string
      responses:
        "200":
          description: The profile with its derived thresholds.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Profile"
        "400":
          $ref: "#/components/responses/invalid_query"
        "401":
          $ref: "#/components/responses/unauthenticated"
        "403":
          $ref: "#/components/responses/forbidden"
        "429":
          $ref: "#/components/responses/rate_limited"
        "500":
          $ref: "#/components/responses/internal"
        "503":
          $ref: "#/components/responses/service_unavailable"
    put:
      operationId: putProfile
      summary: Save a profile
      description: >-
        Validate and save a profile for its scope. The thresholds are derived
        from the costs, and a profile that states no certify claim takes the
        default; values sent for thresholds or default are ignored.
      x-limen-action: profile.write
      x-limen-resource:
        kind: Profile
        fields: [org, action_kind, agent]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Profile"
      responses:
        "413":
          $ref: "#/components/responses/body_too_large"
        "200":
          description: The saved profile with its derived thresholds.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Profile"
        "400":
          $ref: "#/components/responses/invalid_profile"
        "401":
          $ref: "#/components/responses/unauthenticated"
        "403":
          $ref: "#/components/responses/forbidden"
        "422":
          $ref: "#/components/responses/ask_too_costly"
        "429":
          $ref: "#/components/responses/rate_limited"
        "500":
          $ref: "#/components/responses/internal"
        "503":
          $ref: "#/components/responses/service_unavailable"
  /v1/replays:
    post:
      operationId: replay
      summary: Replay recorded history
      description: >-
        Predict recorded actions in time order, each before its own answer
        is learned, and report what Limen would have suggested. Without
        keep, the replay learns in a scratch model and keeps nothing; with
        keep=true, the records are learned into the live models and the
        ledger, as if they had arrived as decisions and answers. At most
        100000 records per replay.
      x-limen-action: replay.create
      x-limen-resource:
        kind: Replay
        fields: [org]
      parameters:
      - name: keep
        in: query
        schema:
          type: boolean
          default: false
      requestBody:
        required: true
        content:
          application/x-ndjson:
            schema:
              $ref: "#/components/schemas/ReplayRecord"
      responses:
        "200":
          description: The report.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReplayReport"
        "400":
          $ref: "#/components/responses/invalid_replay"
        "401":
          $ref: "#/components/responses/unauthenticated"
        "403":
          $ref: "#/components/responses/forbidden"
        "413":
          $ref: "#/components/responses/body_too_large"
        "429":
          $ref: "#/components/responses/rate_limited"
        "500":
          $ref: "#/components/responses/internal"
        "503":
          $ref: "#/components/responses/service_unavailable"
  /v1/subjects/forget:
    post:
      operationId: forgetSubject
      summary: Forget a person
      description: >-
        Delete everything Limen holds about one subject in one organization:
        cases, answers, and the model learned from them. Idempotent.
      x-limen-action: subject.forget
      x-limen-resource:
        kind: Subject
        fields: [org, subject]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ForgetRequest"
      responses:
        "413":
          $ref: "#/components/responses/body_too_large"
        "204":
          description: Nothing about the subject remains in the organization.
        "400":
          $ref: "#/components/responses/invalid_query"
        "401":
          $ref: "#/components/responses/unauthenticated"
        "403":
          $ref: "#/components/responses/forbidden"
        "429":
          $ref: "#/components/responses/rate_limited"
        "500":
          $ref: "#/components/responses/internal"
        "503":
          $ref: "#/components/responses/service_unavailable"
components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: A token from an issuer this installation lists, carrying the audience it verifies.
  parameters:
    org:
      name: org
      in: query
      required: true
      schema:
        type: string
    subject:
      name: subject
      in: query
      required: true
      schema:
        type: string
  schemas:
    Verdict:
      type: string
      description: What a decision point does with an action, ordered from most to least permissive. Composing verdicts keeps the least permissive one.
      enum: [allow, flag, ask, block]
    Suggestion:
      type: string
      description: Limen's suggestion. Limen never suggests flag; a flag is the decision point's, when it draws a review.
      enum: [allow, ask, block]
    Probability:
      type: number
      minimum: 0
      maximum: 1
    Action:
      type: object
      description: One proposed action, described by what the decision point can observe before it runs.
      properties:
        org:
          type: string
          description: The organization whose cost profile applies and whose records these are.
        subject:
          type: string
          description: The person on whose behalf the action runs and whose approvals Limen learns, as the issuer and the token's sub joined by a pipe.
          examples:
          - https://issuer.example|usr_42
        action_id:
          type: string
          description: The decision point's own id for the action, unique within the organization and subject.
          examples:
          - ses_9f/toolu_01
        actor:
          $ref: "#/components/schemas/Actor"
        kind:
          type: string
          description: The domain of the action.
          examples:
          - tool
          - egress
          - repo
          - spend
        name:
          type: string
          description: The operation within the kind.
          examples:
          - bash
          - mcp__github__merge_pull_request
          - ref.update
        effect:
          type: string
          description: The widest effect the action can have.
          enum: [none, read, write, external]
        reversible:
          type: boolean
          description: Whether the action can be undone, when known.
        input:
          description: The action's input. Only deterministic feature extractors read it; Limen never stores it.
        target:
          $ref: "#/components/schemas/Target"
        environment:
          $ref: "#/components/schemas/Environment"
        attributes:
          type: object
          description: Further observable facts the domain has. Values are strings, finite numbers, or booleans.
          maxProperties: 64
          additionalProperties:
            type: [string, number, boolean]
        signals:
          type: array
          items:
            $ref: "#/components/schemas/Signal"
      required: [org, subject, action_id, kind, name, effect]
    Actor:
      type: object
      description: Who proposed the action.
      properties:
        kind:
          type: string
          examples:
          - agent
          - service
          - person
        id:
          type: string
        session:
          type: string
      required: [kind]
    Target:
      type: object
      properties:
        kind:
          type: string
          examples:
          - path
          - ref
          - host
          - account
        id:
          type: string
        sensitivity:
          $ref: "#/components/schemas/Probability"
          description: From 0, a scratch directory, to 1, production.
      required: [kind, id]
    Environment:
      type: object
      properties:
        kind:
          type: string
          examples:
          - host
          - sandbox
          - service
        credentialed:
          type: boolean
          description: The environment holds a credential that reaches outside it.
      required: [kind, credentialed]
    Signal:
      type: object
      description: Another opinion about the action, treated as evidence. It carries a verdict, a score, or both.
      properties:
        source:
          type: string
          examples:
          - rules/1
          - classifier/claude-auto-mode
        verdict:
          $ref: "#/components/schemas/Verdict"
        score:
          $ref: "#/components/schemas/Probability"
      required: [source]
      anyOf:
      - required: [verdict]
      - required: [score]
    Prediction:
      type: object
      description: Limen's opinion about one action, for the decision point to compose with its own rules.
      properties:
        org:
          type: string
        subject:
          type: string
        action_id:
          type: string
        verdict:
          $ref: "#/components/schemas/Suggestion"
        approve:
          $ref: "#/components/schemas/Probability"
          description: The probability that the subject approves the action.
        uncertainty:
          type: number
          minimum: 0
          description: The posterior standard deviation of the latent tolerance behind approve.
        thresholds:
          $ref: "#/components/schemas/Thresholds"
        profile:
          $ref: "#/components/schemas/Scope"
        audit_rate:
          $ref: "#/components/schemas/Probability"
          description: The share of automatic verdicts the profile asks a person to review at random; the rate the decision point passes to its review draw.
        source:
          type: string
          examples:
          - learned/3
        reason:
          type: string
          description: One sentence for the person who reads the record. Never shown to an agent.
      required: [org, subject, action_id, verdict, approve, uncertainty, thresholds, profile, audit_rate, source, reason]
    Thresholds:
      type: object
      description: Above allow_above is an allow, below block_below a block, and everything between, both ends included, an ask.
      properties:
        allow_above:
          $ref: "#/components/schemas/Probability"
        block_below:
          $ref: "#/components/schemas/Probability"
      required: [allow_above, block_below]
    Scope:
      type: object
      description: What a profile applies to.
      properties:
        org:
          type: string
        kind:
          type: string
        agent:
          type: string
      required: [org]
    Decision:
      type: object
      description: What a decision point did with one action, recorded once, before the action runs or a person sees it.
      properties:
        org:
          type: string
        subject:
          type: string
        action_id:
          type: string
        verdict:
          $ref: "#/components/schemas/Verdict"
        review_probability:
          $ref: "#/components/schemas/Probability"
          description: >-
            The probability, fixed before the action ran, that a person sees
            it: positive for flag and ask, below one for allow and block. An
            answer to the action counts with weight one over it.
        source:
          type: string
          description: The policy that decided.
          examples:
          - topos/progressive
          - rules/1
        action:
          $ref: "#/components/schemas/Action"
      required: [org, subject, action_id, verdict, review_probability, source]
    Answer:
      type: object
      properties:
        org:
          type: string
        subject:
          type: string
        action_id:
          type: string
        approve:
          type: boolean
        by:
          type: string
          description: Who answered, when the caller relays the answer for someone else. Honored only when the authorizer allows the relay.
      required: [org, subject, action_id, approve]
    Case:
      type: object
      description: Everything Limen holds about one action.
      properties:
        action:
          $ref: "#/components/schemas/Action"
          description: The action, without its input, which Limen never stores.
        prediction:
          $ref: "#/components/schemas/Prediction"
        decision:
          $ref: "#/components/schemas/Decision"
        answers:
          type: array
          items:
            $ref: "#/components/schemas/RecordedAnswer"
      required: [action]
    RecordedAnswer:
      type: object
      properties:
        approve:
          type: boolean
        by:
          type: string
        at:
          type: string
          format: date-time
        review:
          type: boolean
          description: True for the answer that reviews an action the decision showed a person, the one answer that enters error estimates.
      required: [approve, by, at, review]
    Page:
      type: object
      description: One page of cases. next_cursor is present only when a further page exists.
      properties:
        entries:
          type: array
          items:
            $ref: "#/components/schemas/Case"
        next_cursor:
          type: string
      required: [entries]
    Profile:
      type: object
      description: What an organization states about errors and interruptions for the actions in a scope.
      properties:
        org:
          type: string
        kind:
          type: string
        agent:
          type: string
        costs:
          $ref: "#/components/schemas/Costs"
        audit_rate:
          $ref: "#/components/schemas/Probability"
        certify:
          $ref: "#/components/schemas/Certify"
          description: The claim reliability reports test. Omitted, it is a false-allow rate below 1% at 95% confidence, which takes 300 clean reviews.
        thresholds:
          $ref: "#/components/schemas/Thresholds"
          readOnly: true
        default:
          type: boolean
          readOnly: true
          description: True for the built-in profile Limen applies to a scope with no saved profile.
      required: [org, costs, audit_rate, thresholds]
    Costs:
      type: object
      description: The three prices of a decision, in any one unit. Only their ratios matter. Each kind of error must cost more than two interruptions.
      properties:
        false_allow:
          type: number
          exclusiveMinimum: 0
          description: The cost of running an action the person would deny.
        false_block:
          type: number
          exclusiveMinimum: 0
          description: The cost of refusing an action the person would approve.
        ask:
          type: number
          exclusiveMinimum: 0
          description: The cost of one interruption.
      required: [false_allow, false_block, ask]
    Certify:
      type: object
      description: The claim a reliability report tests, a false-allow rate below alpha at confidence 1 - delta.
      properties:
        alpha:
          type: number
          exclusiveMinimum: 0
          maximum: 1
        delta:
          type: number
          exclusiveMinimum: 0
          exclusiveMaximum: 1
      required: [alpha, delta]
    Reliability:
      type: object
      properties:
        org:
          type: string
        subject:
          type: string
        of:
          type: string
        from:
          type: string
          format: date-time
        to:
          type: string
          format: date-time
        false_allow:
          $ref: "#/components/schemas/Estimate"
        false_block:
          $ref: "#/components/schemas/Estimate"
        certificate:
          $ref: "#/components/schemas/Certificate"
      required: [org, subject, of, from, to, false_allow, false_block, certificate]
    Estimate:
      type: object
      properties:
        value:
          type: [number, "null"]
          minimum: 0
          description: Null when no action in the window could have been reviewed. Null means unknown, not zero.
        interval:
          type: array
          items:
            type: number
          minItems: 2
          maxItems: 2
          description: A 95% interval, present with value.
        covered:
          $ref: "#/components/schemas/Probability"
          description: The share of the source's allows (or blocks) in the window whose review probability was positive; the estimate speaks for that share only.
        reviews:
          type: integer
          minimum: 0
        audits:
          type: integer
          minimum: 0
          description: Reviews whose review probability was below one.
        unanswered:
          type: integer
          minimum: 0
          description: Actions a decision showed a person that have no review yet.
      required: [value, covered, reviews, audits, unanswered]
    Certificate:
      type: object
      properties:
        alpha:
          type: number
        delta:
          type: number
        clean:
          type: integer
          minimum: 0
          description: Consecutive audited allows, most recent first, that the person approved.
        needed:
          type: integer
          minimum: 1
          description: ceil(ln(1/delta)/alpha); 300 for alpha 0.01 and delta 0.05.
        holds:
          type: boolean
      required: [alpha, delta, clean, needed, holds]
    ReplayRecord:
      type: object
      description: One recorded action, one per line.
      properties:
        at:
          type: string
          format: date-time
        action:
          $ref: "#/components/schemas/Action"
        verdict:
          $ref: "#/components/schemas/Verdict"
        review_probability:
          $ref: "#/components/schemas/Probability"
        source:
          type: string
        approve:
          type: boolean
          description: The person's answer; absent when there was none.
      required: [at, action, verdict, review_probability, source]
    ReplayReport:
      type: object
      properties:
        records:
          type: integer
        answered:
          type: integer
        would:
          type: object
          description: Limen's suggestions on the records, counted by verdict.
          propertyNames:
            $ref: "#/components/schemas/Suggestion"
          additionalProperties:
            type: integer
        allowed_denied:
          type: integer
        blocked_approved:
          type: integer
        false_allow:
          $ref: "#/components/schemas/Estimate"
        kept:
          type: boolean
      required: [records, answered, would, allowed_denied, blocked_approved, false_allow, kept]
    ForgetRequest:
      type: object
      properties:
        org:
          type: string
        subject:
          type: string
      required: [org, subject]
    Error:
      type: object
      description: The one error shape of this API. A caller branches on error.code and shows error.message.
      properties:
        error:
          type: object
          properties:
            code:
              type: string
              description: The stable identifier of the row of the error table.
            message:
              type: string
              description: The one sentence of that row, fixed and shown to a person.
            details:
              type: object
              description: "What varies: always request_id, the developer sentence in detail, and the field paths at fault in fields."
              properties:
                request_id:
                  type: string
                detail:
                  type: string
                fields:
                  type: array
                  items:
                    type: string
          required: [code, message]
      required: [error]
  responses:
    service_unavailable:
      description: "503 unavailable or authorizer_unavailable: Limen, or the permission service it asks, is unavailable; a decision point holds the action for a person."
      x-limen-codes: [unavailable, authorizer_unavailable]
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    invalid_action:
      description: "400 invalid_action: The action has a missing field or a value that is not permitted. Correct the fields that the details list, then send the action again."
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    invalid_decision:
      description: "400 invalid_decision: The decision has a missing field or a value that is not permitted. Correct the fields that the details list, then send the decision again."
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    invalid_answer:
      description: "400 invalid_answer: The answer has a missing field. Correct the fields that the details list, then send the answer again."
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    invalid_profile:
      description: "400 invalid_profile: The cost profile has a missing field or a value that is not permitted. Correct the fields that the details list, then save the cost profile again."
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    invalid_query:
      description: "400 invalid_query: The request has a missing field or a value that is not permitted. Correct the fields that the details list, then send the request again."
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    invalid_replay:
      description: "400 invalid_replay: A replayed record has a missing field or a value that is not permitted. Correct the records that the details list, then send the replay again."
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    ask_too_costly:
      description: "422 ask_too_costly: With these costs, Limen would not ask about an action of a person that it has no answers from. Make the cost of each type of error more than two times the cost of an ask."
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    action_conflict:
      description: "409 action_conflict: A different action already uses this action ID. Give each action its own ID."
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    already_decided:
      description: "409 already_decided: This action already has a decision. Limen accepts one decision for each action."
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    no_decision:
      description: "409 no_decision: This action has no recorded decision. Record the decision, then send the answer."
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    unauthenticated:
      description: "401 unauthenticated: The request has no valid credential. Sign in again, then send the request again."
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    forbidden:
      description: "403 forbidden: You do not have permission for this request. Ask an administrator of the organization for access."
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    body_too_large:
      description: "413 body_too_large: The request is larger than the limit of Limen. Send it in smaller parts."
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    rate_limited:
      description: "429 rate_limited: There are too many requests. Wait a short time, then send the request again."
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    internal:
      description: "500 internal: Limen had an internal failure. Send the request again. If the failure continues, report it with the request ID."
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    authorizer_unavailable:
      description: "503 authorizer_unavailable: The permission service is not available. Send the request again after a short time."
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    unavailable:
      description: "503 unavailable: Limen is not available now. Hold the action for a person, and send the request again after a short time."
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
